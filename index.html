          if (!bild) { stand.fehler = "Das Bild ließ sich nicht laden."; zeichnen(); return; }
          var id = "f" + Date.now();
          var kopie = {}; for (var k in fotos) kopie[k] = fotos[k];
          kopie[id] = bild;
          if (!schreibSicher("fotos", kopie)) {
            stand.fehler = "Auf dem Gerät ist kein Platz mehr für Fotos.";
          } else {
            fotos = kopie; stand.fotoId = id; stand.fehler = "";
          }
          zeichnen();
        });
      });

      var weg = $("foto-weg");
      if (weg) weg.addEventListener("click", function () {
        delete fotos[stand.fotoId];
        schreib("fotos", fotos);
        stand.fotoId = null;
        zeichnen();
      });

      $("ins-buch").addEventListener("click", function () {
        erledigt.push(schluessel(e));
        schreib("erledigt", erledigt);
        erlebt.push({
          datum: e.datum, titel: e.titel, kategorie: e.kategorie,
          bewertung: stand.bewertung, notiz: stand.notiz.trim(), fotoId: stand.fotoId
        });
        schreib("erlebt", erlebt);
        neueMitteilung({ von: "!", titel: "Steht jetzt im Buch: " + e.titel,
          text: BEWERTUNG[stand.bewertung - 1] + (stand.fotoId ? " · mit Foto" : "") });
        sheetAuf(
          "<h3>Steht im Buch</h3>" +
          "<p>Die drei bekommen es gleich zu sehen.</p>" +
          '<button class="cta quiet" data-zu>Gut</button>'
        );
        zeichneAlles();
        zeichneBuch();
      });
    }

    zeichnen();
  }

  function buchSheet(b) {
    sheetAuf(
      '<div class="bild ' + phKlasse(b) + '"' + phStil(b) + "></div>" +
      '<div class="kicker">' + b.monat + "</div>" +
      "<h3>" + roh(b.titel) + "</h3>" +
      "<p>" + roh(b.reaktionen) + "</p>" +
      '<button class="cta quiet" data-zu>Zurück</button>'
    );
  }

  /* ---------- Buch ---------- */
  function zeichneBuch() {
    $("filters").innerHTML = INHALT.filter.map(function (f, i) {
      return '<button class="fil" aria-pressed="' + (i === 0) + '" data-f="' + f.schluessel + '">' + f.name + "</button>";
    }).join("");

    var seiten = buchSeiten();
    $("stack").innerHTML = seiten.map(function (b, i) {
      return '<button class="entry tap ' + b.farbe + '" data-b="' + i + '" data-art="' + b.art + '">' +
        '<div class="' + phKlasse(b) + '"' + phStil(b) + "></div>" +
        '<div class="cap"><div class="kicker">' + b.monat + "</div><h4>" + roh(b.titel) + "</h4></div>" +
        '<div class="foot">' + roh(b.reaktionen) + "</div></button>";
    }).join("");

    Array.prototype.forEach.call($("stack").children, function (el) {
      el.addEventListener("click", function () { buchSheet(seiten[+el.dataset.b]); });
    });

    var fils = $("filters").children;
    Array.prototype.forEach.call(fils, function (f) {
      f.addEventListener("click", function () {
        Array.prototype.forEach.call(fils, function (x) { x.setAttribute("aria-pressed", "false"); });
        f.setAttribute("aria-pressed", "true");
        Array.prototype.forEach.call($("stack").children, function (e) {
          e.hidden = !(f.dataset.f === "alles" || e.dataset.art === f.dataset.f);
        });
      });
    });
  }

  /* ---------- Familie: der Plan der nächsten Wochen ---------- */
  var WOCHEN_VORAUS = 5;
  var entwurf = null;

  /* Welcher Monat steht gerade im Raster? null heisst: der laufende.
     Zurueckblaettern ist kein Luxus — daran sieht man, wie man die
     letzten Wochen getaktet hat, und das ist die Frage aus Abschnitt 9
     (leicht / Anker / mit Oma / etwas Neues). Nach vorn plant man. */
  var blickMonat = null;

  function monatsAnker() {
    var d = blickMonat || new Date();
    return new Date(d.getFullYear(), d.getMonth(), 1);
  }
  function monatWechseln(n) {
    var a = monatsAnker();
    blickMonat = new Date(a.getFullYear(), a.getMonth() + n, 1);
    zeichneFamilie();
  }

  /* ---------- Was könnte man an diesem Tag vorschlagen? ---------------
     Erst das Offizielle: was an diesem Wochentag wirklich stattfindet.
     Dann aufgefüllt auf drei — mit Kleinigkeiten aus dem Vorrat.

     Die Auswahl hängt am Datum, nicht am Zufall. Dasselbe Blatt zweimal
     geöffnet zeigt dasselbe; sonst könnte man einen Vorschlag nicht
     wiederfinden, den man gerade noch gesehen hat.

     Es ist mit Absicht keine KI im Spiel. Katalog plus ein gepflegter
     Vorrat fühlt sich fast genauso an, läuft ohne Netz und ohne Server —
     und ein LLM kann später an genau dieser Stelle andocken, ohne dass
     sich am Blatt etwas ändert.
     ------------------------------------------------------------------ */
  var VORSCHLAEGE_PRO_TAG = 3;

  // Kleiner, stabiler Zahlenwert aus einem Text. Ersetzt den Zufall.
  function streuung(text) {
    var h = 0;
    for (var i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) % 100000;
    return h;
  }

  /* ---------- Die Woche, die es schon gibt ---------------------------
     Bevor die App irgendetwas vorschlägt, muss sie wissen, was ohnehin
     läuft. Alles hier ist von der Familie am 07.09.2026 gesagt worden,
     nichts davon ist geraten.

       Rad      Dienstag und Freitag, 9:30 bis 13 Uhr, mit der Gruppe
       Oma      Mo, Di, Do, Fr von 8:00 bis 15:30 bei "Hand in Hand"
       Mittwoch Orga-Tag der beiden: Friseur, Ergotherapie, Termine
       Mittag   gegen 12 wird gegessen, danach meist eine Stunde Ruhe

     Für die Kleinigkeiten sind das harte Grenzen — sie haben ja keine
     feste Zeit, also können sie sich danach richten. Für ein offizielles
     Angebot sind es keine: das darf querliegen. Dann isst man eben einmal
     später. Es wird ja nur vorgeschlagen, nicht beschlossen.
     -------------------------------------------------------------------- */
  var RADTAGE = [2, 5];                    // Dienstag, Freitag
  var ORGA_TAG = 3;                        // Mittwoch
  function radTag(wt) { return RADTAGE.indexOf(wt) >= 0; }

  /* Wann ist Oma zu Hause?
     Am Wochenende ganz. Am Orga-Tag nur abends, weil die beiden tagsüber
     unterwegs sind. Sonst ab halb vier — am Vormittag also nie. */
  function omaZuHause(tag, tageszeit) {
    var wt = (tag.getDay() + 6) % 7 + 1;
    if (wt === 6 || wt === 7) return true;
    if (wt === ORGA_TAG) return tageszeit === "abend";
    return tageszeit !== "frueh";
  }

  function passtAnTag(k, tag) {
    var wt = (tag.getDay() + 6) % 7 + 1;              // 1 = Montag
    if (k.tage && k.tage.indexOf(wt) < 0) return false;
    if (k.monate && k.monate.indexOf(tag.getMonth() + 1) < 0) return false;
    if (k.omaDa && !omaZuHause(tag, k.tageszeit)) return false;
    // Vormittags am Dienstag und Freitag sitzt er auf dem Rad. Ihm dann
    // eine Kleinigkeit vorzuschlagen hieße, ihn davon abzuhalten — und das
    // Rad ist der eine Termin, der seit Jahren von allein läuft.
    if (k.tageszeit === "frueh" && radTag(wt)) return false;
    return true;
  }

  /* Was an diesem Tag ohnehin läuft. Steht oben im Tagesblatt, damit
     niemand dagegen plant, ohne es zu merken. */
  function tagesRoutine(tag) {
    var wt = (tag.getDay() + 6) % 7 + 1;
    if (wt === ORGA_TAG) return "Orga-Tag: Friseur, Ergotherapie, was sonst ansteht.";
    if (radTag(wt)) return "Radgruppe, 9:30 bis 13 Uhr.";
    return "";
  }

  /* Ein Satz, wenn ein offizielles Angebot quer zur Gewohnheit liegt.
     Er verbietet nichts, er sagt nur, was dann verschoben wird. */
  function quergedacht(v, tag) {
    var wt = (tag.getDay() + 6) % 7 + 1;
    if (!v.zeit) return "";
    // Die Radtour selbst ist die Radzeit — sie kommentiert sich nicht.
    if (v.id === "rad") return "";
    if (radTag(wt) && v.zeit < "13:00") return "Liegt in der Radzeit";
    if (v.zeit >= "11:30" && v.zeit < "14:00") return "Liegt im Mittagessen und der Ruhe danach";
    return "";
  }

  function tagesVorschlaege(datum) {
    var tag = ausIso(datum);
    var wt = (tag.getDay() + 6) % 7 + 1;
    var schon = alleTermine().filter(function (e) {
      return e.datum === datum && !istAbgesagt(e);
    });
    /* Steht das an dem Tag schon? Ein Angebot wird über seine Kennung
       erkannt, nicht über den Titel: im Katalog heisst es "Warmbadetag",
       im Plan "Warmbadetag im Hallenbad". Über den Titel verglichen käme
       es als Vorschlag zurück, obwohl es längst steht. */
    function belegtId(id) {
      return schon.filter(function (e) { return e.id === id; }).length > 0;
    }
    function belegtTitel(titel) {
      return schon.filter(function (e) { return e.titel === titel; }).length > 0;
    }

    // 1. Das Offizielle zuerst. Es hat den festen Zeitpunkt — alles
    //    andere richtet sich danach, nicht umgekehrt.
    var raus = INHALT.vorschlaege.filter(function (v) {
      // Die Radgruppe fährt zweimal in der Woche. Ein Angebot darf deshalb
      // mehrere Tage tragen, nicht nur einen.
      var tage = v.wochentage || [v.wochentag];
      return tage.indexOf(wt) >= 0 && !belegtId(v.id);
    }).map(function (v) {
      var quer = quergedacht(v, tag);
      return { sorte: "angebot", titel: v.titel, emoji: zeichenVon(v), kategorie: v.kategorie,
               ort: v.ort, zeit: v.zeit, tageszeit: "", zusatz: v.zusatz,
               hinweis: v.kicker + " \u00b7 " + v.hinweis + (quer ? " \u00b7 " + quer : ""),
               quelle: v };
    });

    // 2. Auffüllen. Die Reihenfolge des Vorrats hängt am Datum, damit
    //    nicht jeden Tag dasselbe oben steht.
    var vorrat = INHALT.kleinigkeiten
      .filter(function (k) { return passtAnTag(k, tag) && !belegtTitel(k.titel); })
      .map(function (k) { return { k: k, r: streuung(datum + "|" + k.titel) }; })
      .sort(function (a, b) { return a.r - b.r; });

    /* Die drei sollen einen Tag abbilden und nicht dreimal denselben Abend.
       Deshalb zwei Durchgänge: erst höchstens eine Sache je Tageszeit,
       danach wird aufgefüllt, wenn noch Platz ist. Ohne das kann derselbe
       Tag drei Vorschläge für nach acht bekommen, und der Vormittag bleibt
       leer, obwohl er der freieste Teil seines Tages ist. */
    var belegteZeit = {};
    raus.forEach(function (v) { if (v.tageszeit) belegteZeit[v.tageszeit] = true; });

    function nimm(nurNeueZeit) {
      vorrat.forEach(function (p) {
        if (raus.length >= VORSCHLAEGE_PRO_TAG) return;
        var k = p.k;
        if (p.drin) return;
        if (nurNeueZeit && belegteZeit[k.tageszeit]) return;
        p.drin = true;
        belegteZeit[k.tageszeit] = true;
        raus.push({ sorte: "kleinigkeit", titel: k.titel, emoji: zeichenVon(k),
                    kategorie: k.kategorie, ort: k.ort, zeit: "", tageszeit: k.tageszeit,
                    zusatz: k.zusatz, hinweis: "", quelle: k });
      });
    }
    nimm(true);
    nimm(false);

    return raus.slice(0, VORSCHLAEGE_PRO_TAG);
  }

  function whatsappText(e) {
    var d = ausIso(e.datum);
    var tag = tagLang(d);
    if (tageDazwischen(new Date(), d) > 7) tag += ", " + d.getDate() + ". " + MON_KURZ[d.getMonth()];
    var text;
    if (e.textVorlage) {
      text = e.textVorlage.replace("{TAG}", tag).replace("{ZEIT}", e.zeit || zeitKurz(e));
    } else {
      var kopf = "Opa, " + tag + " " + zeitSatz(e) + " " + e.titel +
        // Steht der Ort schon im Titel ("Warmbadetag im Hallenbad"), wäre
        // ein zweites "· Hallenbad" dahinter nur Geräusch.
        (e.ort && e.titel.indexOf(e.ort) < 0 ? " \u00b7 " + e.ort : "") + ". ";
      // Ein Angebot muss jemand anmelden, etwas Selbstgemachtes nicht.
      if (istAngebot(e)) kopf += "Ich melde dich an. ";
      // Holt ihn jemand ab, ist das die wichtigste Zeile. Macht er es allein,
      // steht dort nichts Organisatorisches — dann zählt, warum es schön wird.
      var holt = e.abholung && e.abholung.kuerzel !== "\u00b7";
      text = kopf + (holt ? e.abholung.titel + " " + e.abholung.text + "."
                          : (e.zusatz || "Ganz wie du magst."));
    }

    /* Und wie er wieder heimkommt. Das steht auch dann dahinter, wenn der
       Text aus dem Katalog kommt — die fertigen Texte dort erzählen nur die
       Hinfahrt, und genau das war die Lücke: wer hingebracht wird, fragt
       sich ab dem Moment, wer ihn wieder holt. */
    if (e.rueckweg && e.rueckweg.kuerzel !== "\u00b7") {
      text += " " + e.rueckweg.titel + " " + e.rueckweg.text + ".";
    }
    return text;
  }

  /* Der Blick von oben. Fünf Wochenzeilen ab diesem Montag — nie ein
     Kalendermonat, damit "diese Woche" immer die oberste Zeile ist und
     man "jetzt" nie suchen muss.

     Auf einem Tag mit Termin steht sein Zeichen, und die Fläche trägt die
     Farbe der Kategorie. Damit sieht man die Dosierung über den Monat —
     welche Woche voll ist, welche leer, und was für eine Sorte Woche es
     war. Ein Wochenmarker daneben wäre Doppelung.

     Gefüllt dunkel heisst weiterhin genau eines: heute.
     Ein Tipp auf einen Tag öffnet das Tagesblatt. */
  function zeichneRaster(termine) {
    var heute = mitternacht(new Date());
    var erster = monatsAnker();
    var monat = erster.getMonth();

    // Das Raster faengt am Montag vor dem Monatsersten an und hoert am
    // Sonntag nach dem Monatsletzten auf — die Woche bleibt die Einheit,
    // auch wenn sie ueber den Monatswechsel laeuft.
    var start = montagDieserWoche(erster);
    var letzter = new Date(erster.getFullYear(), monat + 1, 0);
    var zeilen = Math.ceil((tageDazwischen(start, letzter) + 1) / 7);

    var zellen = "";
    for (var i = 0; i < zeilen * 7; i++) {
      var tag = plusTage(start, i);
      var drauf = termine.filter(function (x) { return x.datum === iso(tag); });
      var steht = drauf.filter(function (x) { return !istAbgesagt(x); });
      var zeigt = steht[0] || drauf[0] || null;
      var istHeute = +tag === +heute;

      var k = "rz";
      if (tag.getMonth() !== monat) k += " fremd";
      if (istHeute) k += " heute";
      else if (tag < heute) k += " vorbei";
      if (zeigt) k += " hat";
      if (zeigt && !steht.length) k += " ab";

      // Die Farbe kommt aus der Kategorie und wird hier gesetzt, nicht im
      // CSS: an "heute" darf sie nicht ran, sonst wäre der dunkle Tag weg.
      var farbe = (zeigt && steht.length && !istHeute)
        ? ' style="background:var(--c-' + zeigt.kategorie + ')"' : "";

      zellen += '<button class="' + k + '"' + farbe + ' data-tag="' + iso(tag) + '" ' +
        'aria-label="' + langesDatum(tag) + (zeigt ? ", " + roh(zeigt.titel) : "") + '">' +
        (drauf.length > 1 ? '<span class="mehr"></span>' : "") +
        (zeigt ? '<span class="em">' + zeichenVon(zeigt) + "</span>" : "") +
        '<span class="n">' + tag.getDate() + "</span></button>";
    }
    var imLaufenden = erster.getFullYear() === heute.getFullYear() &&
                      monat === heute.getMonth();

    $("raster").innerHTML =
      '<div class="monatszeile">' +
        '<p class="monat">' + MONATE[monat] + " " + erster.getFullYear() + "</p>" +
        (imLaufenden ? "" : '<button class="zuheute" data-m="0">Heute</button>') +
        '<button class="mpfeil" data-m="-1" aria-label="Ein Monat zurück">\u2039</button>' +
        '<button class="mpfeil" data-m="1" aria-label="Ein Monat weiter">\u203a</button>' +
      "</div>" +
      '<div class="kopf">' + TAGE_KURZ.map(function (t) { return "<span>" + t + "</span>"; }).join("") + "</div>" +
      '<div class="netz">' + zellen + "</div>";

    Array.prototype.forEach.call($("raster").querySelectorAll("[data-m]"), function (el) {
      el.addEventListener("click", function () {
        var n = +el.dataset.m;
        if (n === 0) { blickMonat = null; zeichneFamilie(); return; }
        monatWechseln(n);
      });
    });

    Array.prototype.forEach.call($("raster").querySelectorAll(".rz"), function (el) {
      el.addEventListener("click", function () { tagSheet(el.dataset.tag); });
    });
  }

  function zeichneFamilie() {
    var mo = montagDieserWoche(new Date());
    var termine = alleTermine();

    // Jede Absage, die noch bevorsteht. Frueher verschwand die Warnung,
    // sobald in derselben Woche etwas anderes stand — damit ging aber die
    // Nachricht "er hat abgesagt" verloren. Sie bleibt jetzt stehen, bis
    // jemand den Termin neu legt oder herausnimmt. Beides ist ein Tipp.
    var offeneAbsage = termine.filter(function (e) {
      return istAbgesagt(e) && tageDazwischen(new Date(), ausIso(e.datum)) >= 0;
    })[0];

    /* Ein Hinweis oben in der Familien-Ansicht.
       Jeder trägt ein X. Was nicht weggeht, liest nach dem dritten Mal
       niemand mehr — und dann geht auch der nächste unter, der wirklich
       zählt. Weggeklickt wird der Hinweis, nicht die Sache: ändert sich
       der Anlass, kommt er unter einem neuen Schlüssel wieder.
       Wo ein Tag dranhängt, öffnet ein Tipp dessen Tagesblatt — man liest
       so einen Hinweis ja, um etwas daran zu tun. */
    function hinweis(sch, ic, titel, text, art) {
      if (weggeklickt.indexOf(sch) >= 0) return "";
      art = art || {};
      return '<div class="banner' + (art.still ? " still" : "") +
        (art.tag ? " tippbar" : "") + '"' +
        (art.tag ? ' data-tagblatt="' + art.tag + '"' : "") + ">" +
        '<div class="ic">' + ic + "</div>" +
        '<div class="tx"><b>' + titel + "</b><span>" + text + "</span></div>" +
        '<button class="zu" data-hinweis="' + sch +
          '" aria-label="Hinweis wegmachen">\u00d7</button></div>';
    }

    var banner = "";
    if (offeneAbsage) {
      // Steht in der Woche sonst noch etwas? Davon haengt ab, was zu tun ist.
      var moA = montagDieserWoche(ausIso(offeneAbsage.datum)), soA = plusTage(moA, 6);
      var restWoche = termine.filter(function (x) {
        var d = ausIso(x.datum);
        return d >= moA && d <= soA && !istAbgesagt(x);
      }).length;
      banner += hinweis("absage|" + schluessel(offeneAbsage), "!",
        "Opa hat abgesagt: " + roh(offeneAbsage.titel) +
          " (" + tagKurz(ausIso(offeneAbsage.datum)) + ")",
        "„" + roh(gruende[schluessel(offeneAbsage)] || "Ohne Angabe") + "“ · " +
          (restWoche ? "In der Woche steht noch etwas anderes."
                     : "Die Woche steht wieder offen."),
        { tag: offeneAbsage.datum });
    }

    // Termin war, aber es kam nichts zurück. Genau dann ruft man an —
    // sonst erfährt niemand, ob er überhaupt da war.
    var ohneRueck = termine.filter(function (e) {
      var alter = -tageDazwischen(new Date(), ausIso(e.datum));
      return schonVorbei(e) && !istAbgesagt(e) && !istErledigt(e) && alter >= 0 && alter <= 7;
    })[0];
    if (ohneRueck) {
      banner += hinweis("rueck|" + schluessel(ohneRueck), "?",
        "Keine Rückmeldung: " + roh(ohneRueck.titel),
        "War am " + tagLang(ausIso(ohneRueck.datum)) +
          ". Ob er da war, weiß bisher niemand.",
        { still: true });
    }

    /* Er selbst hat gesagt, dass er an einem Tag etwas machen möchte.
       Das ist der einzige Hinweis hier, der nicht aus unserer Planung
       kommt, sondern von ihm — deshalb steht er oben und nicht in einer
       Liste. Sobald an dem Tag etwas steht, ist er erledigt und geht von
       selbst weg. */
    gemeldet.forEach(function (d) {
      if (tageDazwischen(new Date(), ausIso(d)) < 0) return;
      var stehtSchon = termine.filter(function (x) {
        return x.datum === d && !istAbgesagt(x);
      }).length;
      if (stehtSchon) return;
      var dd = ausIso(d);
      banner += hinweis("lust|" + d, "O", "Opa hätte Lust auf etwas",
        tagLang(dd) + ", " + dd.getDate() + ". " + MON_KURZ[dd.getMonth()] +
          " ist bei ihm noch frei.",
        { tag: d });
    });

    $("fam-banner").innerHTML = banner;

    alle("#fam-banner [data-hinweis]").forEach(function (b) {
      b.addEventListener("click", function (ev) {
        ev.stopPropagation();
        weggeklickt.push(b.dataset.hinweis);
        schreib("weggeklickt", weggeklickt);
        zeichneFamilie();
      });
    });
    alle("#fam-banner [data-tagblatt]").forEach(function (b) {
      b.addEventListener("click", function () { tagSheet(b.dataset.tagblatt); });
    });

    zeichneRaster(termine);

    // Wie viele der nächsten Wochen sind noch leer? Das ist die einzige
    // Zahl, die aus der weggefallenen Wochenliste übrig bleibt — sie steht
    // als Zeile über dem Titel. Alles andere sagt das Raster besser.
    var leereWochen = 0;
    for (var w = 0; w < WOCHEN_VORAUS; w++) {
      var start = plusTage(mo, w * 7), ende = plusTage(start, 6);
      var drin = termine.filter(function (e) {
        var d = ausIso(e.datum);
        return d >= start && d <= ende && !istAbgesagt(e);
      });
      if (!drin.length) leereWochen++;
    }

    $("fam-eyebrow").textContent = leereWochen
      ? leereWochen + (leereWochen === 1 ? " Woche" : " Wochen") + " noch leer"
      : "Die nächsten Wochen stehen";

    if (offeneAbsage) {
      entwurf = { titel: "Antwort auf die Absage",
        text: "Opa, alles gut — " + offeneAbsage.titel + " ist abgesagt. Ich such was anderes für die Woche und sag dir Bescheid." };
    } else if (!entwurf) {
      var naechster = termine.filter(function (e) { return !schonVorbei(e) && !istAbgesagt(e); })[0];
      entwurf = naechster
        ? { titel: "WhatsApp an Opa", text: whatsappText(naechster) }
        : { titel: "WhatsApp an Opa", text: "Opa, ich schau, was nächste Woche geht, und meld mich." };
    }
    $("draft-titel").textContent = entwurf.titel;
    $("draft").textContent = entwurf.text;
    zuruecksetzenKopieren();

    zeichneWerkbank();
  }

  /* ---------- Tagesblatt ----------------------------------------------
     Das Blatt, auf dem geplant wird. Oben der Streifen: der angetippte Tag
     und drei Tage links und rechts — man wechselt den Tag, ohne das Blatt
     zu verlassen, und der Streifen hört mit Absicht nicht am Sonntag auf.
     Darunter, was schon steht, und dann drei Vorschläge.

     Es hat das Wochenblatt abgelöst. Beide haben dieselbe Frage beantwortet
     ("was mache ich mit diesem Stück Zeit"), nur auf zwei Blättern. Die
     Woche steht jetzt im Raster darüber, wo sie hingehört.

     Opa sieht dieses Blatt nie.
     -------------------------------------------------------------------- */
  var STREIFEN_RAND = 3;

  function tagSheet(datum) {
    var tag = ausIso(datum);
    var heute = mitternacht(new Date());
    var termine = alleTermine();
    var drin = termine.filter(function (e) { return e.datum === datum; });
    var mo = montagDieserWoche(tag);
    // Seit man Monate zurueckblaettern kann, laesst sich auch ein Tag
    // oeffnen, der vorbei ist. Dann gibt es nichts vorzuschlagen — man
    // schaut nach, was war. Planen kann man nur nach vorn.
    var vergangen = tag < heute;
    var vor = vergangen ? [] : tagesVorschlaege(datum);

    var streifen = "";
    for (var i = -STREIFEN_RAND; i <= STREIFEN_RAND; i++) {
      var t = plusTage(tag, i);
      var drauf = termine.filter(function (x) { return x.datum === iso(t) && !istAbgesagt(x); });
      streifen += '<button class="st' + (t < heute ? " vorbei" : "") + '" data-st="' + iso(t) + '" ' +
        'aria-pressed="' + (i === 0) + '" aria-label="' + langesDatum(t) + '">' +
        '<span class="wt">' + tagKurz(t) + "</span>" +
        '<span class="n">' + t.getDate() + "</span>" +
        '<span class="em">' + (drauf.length ? zeichenVon(drauf[0]) : "") + "</span></button>";
    }

    var html =
      '<div class="kicker">' + MONATE[tag.getMonth()] + "</div>" +
      "<h3>" + tagLang(tag) + ", " + tag.getDate() + ". " + MON_KURZ[tag.getMonth()] + "</h3>" +
      '<div class="streifen" id="tg-streifen">' + streifen + "</div>";

    var routine = tagesRoutine(tag);
    if (routine) {
      html += '<div class="routine"><b>' + tagLang(tag) + "</b><span>" +
        roh(routine) + "</span></div>";
    }

    if (drin.length) {
      html += '<div class="abschnitt"><h5>Steht schon</h5></div>' +
        drin.map(function (e, i) {
          var ab = istAbgesagt(e);
          return '<div class="geplant' + (ab ? " ab" : "") + '" data-i="' + i + '"' +
            (istZiehbar(e) && !ab ? ' data-zieh="1"' : "") + ">" +
            '<span class="em">' + zeichenVon(e) + "</span>" +
            '<button class="tx" data-bearb="' + i + '"><b>' + roh(e.titel) + "</b><span>" +
            (ab ? "Abgesagt \u00b7 " + roh(gruende[schluessel(e)] || "ohne Angabe")
                : roh(zeitLang(e)) + " \u00b7 " + roh(e.ort) +
                  (rueckwegOffen(e) ? ' \u00b7 <em class="offen">Rückweg offen</em>' : "")) +
            "</span></button>" +
            '<button class="weg" data-weg="' + i + '" aria-label="Wieder herausnehmen">\u00d7</button></div>';
        }).join("");

      if (drin.filter(function (e) { return istZiehbar(e) && !istAbgesagt(e); }).length) {
        html += '<p class="zieh-hinweis">Gedrückt halten und auf einen anderen Tag ziehen. ' +
          "Feste Angebote bleiben, wo sie sind — die finden nur an ihrem Tag statt.</p>";
      }
    }

    if (vergangen) {
      if (!drin.length) html += "<p>An dem Tag stand nichts.</p>";
    } else {
      html += '<div class="abschnitt"><h5>Vorschläge für diesen Tag</h5>' +
        "<p>Antippen öffnet die Einzelheiten.</p></div>";

      html += vor.length
        ? vor.map(function (v, i) {
            return '<button class="vor' + (v.sorte === "angebot" ? " fest" : "") + '" data-vor="' + i + '">' +
              '<span class="em">' + v.emoji + "</span>" +
              '<span class="tx"><b>' + roh(v.titel) + "</b>" +
              "<span>" + roh(zeitLang(v)) + " \u00b7 " + roh(v.ort) + "</span>" +
              (v.hinweis ? "<em>" + roh(v.hinweis) + "</em>" : "") + "</span>" +
              '<span class="plus">+</span></button>';
          }).join("")
        : "<p>Für diesen Tag ist der Vorrat leer. Trag etwas Eigenes ein.</p>";

      html += '<div class="aktionsreihe">' +
        '<button class="cta leise" id="tg-frei">Etwas anderes eintragen</button>' +
        '<button class="cta leise archiv" id="tg-archiv">Archiv</button>' +
        "</div>";
    }

    html += '<button class="cta quiet" data-zu>Zurück</button>';

    sheetAuf(html);

    /* --- Verschieben ---------------------------------------------------
       Gedrückt halten, auf einen Tag im Streifen ziehen. Auf dem iPhone
       ist Ziehen mit dem Finger heikel, deshalb ist es hier die Abkürzung
       und nicht der einzige Weg: wer loslässt, ohne gezogen zu haben,
       behält die Ziele stehen und kann eines antippen. Und über die
       Einzelheiten lässt sich der Tag sowieso ändern.
       ------------------------------------------------------------------ */
    var zieht = null, wartet = null, langsam = null, gezogen = false;

    // Ziel darf nur sein, was noch kommt. Etwas in die Vergangenheit zu
    // schieben ergibt keinen Sinn, also wird es gar nicht erst angeboten.
    function zielTag(el) {
      return el.dataset.st !== datum && ausIso(el.dataset.st) >= heute;
    }
    function ziele(an) {
      alle("#tg-streifen .st").forEach(function (b) {
        b.classList.toggle("ziel", !!an && zielTag(b));
        if (!an) b.classList.remove("drueber");
      });
    }
    function unter(x, y) {
      var treffer = null;
      alle("#tg-streifen .st").forEach(function (b) {
        var r = b.getBoundingClientRect();
        if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) treffer = b;
      });
      return treffer;
    }
    // Solange gezogen wird, darf das Blatt nicht mitscrollen.
    function schluck(ev) { if (zieht) ev.preventDefault(); }

    function verschieben(e, ziel) {
      ziele(false);
      if (!e || !ziel || ziel === e.datum) return;
      var kopie = JSON.parse(JSON.stringify(e));
      kopie.uid = e.uid || kennung();
      kopie.datum = ziel;
      // Ein Beispieltermin wird beim Verschieben zu einem echten Termin.
      if (!e.uid) { geloescht.push(schluessel(e)); schreib("geloescht", geloescht); }
      eigene = eigene.filter(function (x) { return x.uid !== kopie.uid; });
      eigene.push(kopie);
      schreib("eigene", eigene);
      var d = ausIso(ziel);
      entwurf = { titel: "WhatsApp an Opa", text: whatsappText(kopie) };
      neueMitteilung({ von: "P", titel: "Verschoben: " + kopie.titel,
        text: "Jetzt " + tagLang(d) + ", " + d.getDate() + ". " + MON_KURZ[d.getMonth()] + "." });
      zeichneAlles();
      tagSheet(ziel);
    }

    alle("#sheet .geplant[data-zieh]").forEach(function (karte) {
      var start = null;
      karte.addEventListener("pointerdown", function (ev) {
        start = { x: ev.clientX, y: ev.clientY };
        gezogen = false;
        clearTimeout(langsam);
        langsam = setTimeout(function () {
          zieht = karte;
          karte.classList.add("hebt");
          ziele(true);
          document.addEventListener("touchmove", schluck, { passive: false });
          try { karte.setPointerCapture(ev.pointerId); } catch (e2) {}
        }, 380);
      });
      karte.addEventListener("pointermove", function (ev) {
        if (!zieht) {
          // Noch kein Ziehen. Wer scrollen will, soll scrollen dürfen.
          if (start && Math.abs(ev.clientY - start.y) > 9) clearTimeout(langsam);
          return;
        }
        gezogen = true;
        var z = unter(ev.clientX, ev.clientY);
        alle("#tg-streifen .st").forEach(function (b) {
          b.classList.toggle("drueber", b === z && zielTag(b));
        });
      });
      function los(ev) {
        clearTimeout(langsam);
        karte.classList.remove("hebt");
        document.removeEventListener("touchmove", schluck, { passive: false });
        if (!zieht) return;
        zieht = null;
        var e = drin[+karte.dataset.i];
        var z = ev && ev.clientX != null ? unter(ev.clientX, ev.clientY) : null;
        if (z && zielTag(z)) { verschieben(e, z.dataset.st); return; }
        // Gehalten, aber nicht gezogen: die Ziele bleiben stehen und
        // warten auf einen Tipp. Das ist der Weg, der immer funktioniert.
        if (!gezogen) { wartet = e; return; }
        ziele(false);
      }
      karte.addEventListener("pointerup", los);
      karte.addEventListener("pointercancel", function () {
        clearTimeout(langsam); zieht = null; wartet = null;
        karte.classList.remove("hebt"); ziele(false);
        document.removeEventListener("touchmove", schluck, { passive: false });
      });
    });

    alle("#tg-streifen .st").forEach(function (b) {
      b.addEventListener("click", function () {
        if (wartet) {
          var w = wartet; wartet = null;
          if (zielTag(b)) { verschieben(w, b.dataset.st); return; }
          ziele(false);
          return;
        }
        tagSheet(b.dataset.st);
      });
    });

    alle("#sheet [data-bearb]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (wartet) { wartet = null; ziele(false); return; }
        terminSheet(drin[+b.dataset.bearb], mo, null, tag);
      });
    });

    alle("#sheet [data-weg]").forEach(function (b) {
      b.addEventListener("click", function () {
        var raus = drin[+b.dataset.weg];
        geloescht.push(schluessel(raus));
        schreib("geloescht", geloescht);
        eigene = eigene.filter(function (x) { return schluessel(x) !== schluessel(raus); });
        schreib("eigene", eigene);
        // Mit dem Termin geht auch seine Absage — sonst bliebe ein Grund
        // zu etwas stehen, das es nicht mehr gibt.
        abgesagt = abgesagt.filter(function (x) { return x !== schluessel(raus); });
        schreib("abgesagt", abgesagt);
        neueMitteilung({ von: "P", titel: "Wieder herausgenommen: " + raus.titel,
          text: tagLang(tag) + " ist wieder frei." });
        zeichneAlles();
        tagSheet(datum);
      });
    });

    // Ein Vorschlag füllt das Formular vor. Ausgewählt ist er damit noch
    // nicht — erst das Speichern legt ihn an. Die Auswahl bleibt beim
    // Menschen, auch wenn nur noch ein Tipp fehlt.
    alle("#sheet [data-vor]").forEach(function (b) {
      b.addEventListener("click", function () {
        var v = vor[+b.dataset.vor];
        terminSheet(null, mo, v, tag);
      });
    });

    var frei = $("tg-frei");
    if (frei) frei.addEventListener("click", function () { terminSheet(null, mo, null, tag); });
    var arch = $("tg-archiv");
    if (arch) arch.addEventListener("click", function () { archivSheet(datum, mo); });
  }

  /* ---------- Archiv --------------------------------------------------
     Alles, was schon einmal im Plan stand, dazu der Katalog und der ganze
     Vorrat an Kleinigkeiten — einmal nach Titel zusammengefasst.

     Es beantwortet die Frage "das hatten wir doch schon mal, wie hiess das
     noch". Ohne das gibt es nur die drei Vorschlaege des Tages oder ein
     leeres Formular, und beim zweiten Mal tippt man alles neu ab.
     Was er schon hatte, steht oben und mit Datum; der Rest darunter.
     -------------------------------------------------------------------- */
  function katalogZu(id) {
    return INHALT.vorschlaege.filter(function (v) { return v.id === id; })[0] || null;
  }

  function archivEintraege() {
    var gesehen = {}, kennungen = {}, raus = [];
    /* Zweimal dasselbe darf nicht in der Liste stehen — und "dasselbe"
       heisst beim Angebot die Kennung, nicht der Titel: im Katalog heisst
       es "Warmbadetag", im Plan "Warmbadetag im Hallenbad". Ueber den
       Titel verglichen stuenden beide da. Dieselbe Falle wie bei den
       Tagesvorschlaegen. */
    function rein(x, wann, id) {
      var da = gesehen[x.titel];
      if (da) { if (wann && !da.wann) da.wann = wann; return; }
      if (id && kennungen[id]) {
        if (wann && !kennungen[id].wann) kennungen[id].wann = wann;
        return;
      }
      x.wann = wann || "";
      gesehen[x.titel] = x;
      if (id) kennungen[id] = x;
      raus.push(x);
    }

    // 1. Was schon einmal dastand — das Neueste zuerst, damit die
    //    Reihenfolge sagt, was zuletzt lief.
    alleTermine().slice().sort(function (a, b) {
      return a.datum < b.datum ? 1 : a.datum > b.datum ? -1 : 0;
    }).forEach(function (e) {
      var holt = e.abholung && e.abholung.kuerzel !== "·";
      rein({
        titel: e.titel, emoji: zeichenVon(e), kategorie: e.kategorie,
        ort: e.ort, zusatz: e.zusatz, zeit: e.zeit || "", tageszeit: e.tageszeit || "",
        // Ein Angebot bleibt ein Angebot: sein Katalogeintrag traegt den
        // fertigen WhatsApp-Text und den Satz fuer danach.
        sorte: istAngebot(e) ? "angebot" : (holt ? "eigen" : "kleinigkeit"),
        quelle: istAngebot(e) ? katalogZu(e.id) : null,
        abholung: holt ? e.abholung : null,
        rueckweg: holt ? e.rueckweg : null
      }, e.datum, istAngebot(e) ? e.id : null);
    });

    // 2. Der Katalog, auch was noch nie dran war.
    INHALT.vorschlaege.forEach(function (v) {
      rein({ titel: v.titel, emoji: zeichenVon(v), kategorie: v.kategorie, ort: v.ort,
             zusatz: v.zusatz, zeit: v.zeit, tageszeit: "",
             sorte: "angebot", quelle: v }, "", v.id);
    });

    // 3. Der Vorrat an Kleinigkeiten.
    INHALT.kleinigkeiten.forEach(function (k) {
      rein({ titel: k.titel, emoji: zeichenVon(k), kategorie: k.kategorie, ort: k.ort,
             zusatz: k.zusatz, zeit: "", tageszeit: k.tageszeit,
             sorte: "kleinigkeit", quelle: k });
    });

    return raus;
  }

  function archivSheet(datum, mo) {
    var tag = ausIso(datum);
    var liste = archivEintraege();
    sheetAuf(
      '<div class="kicker">' + tagLang(tag) + ", " + tag.getDate() + ". " +
        MON_KURZ[tag.getMonth()] + "</div>" +
      "<h3>Archiv</h3>" +
      "<p>Alles, was schon einmal dastand — und der ganze Vorrat. " +
        "Antippen legt es auf diesen Tag.</p>" +
      '<div class="archivliste">' + liste.map(function (a, i) {
        var d = a.wann ? ausIso(a.wann) : null;
        var unten = d
          ? "zuletzt " + d.getDate() + ". " + MON_KURZ[d.getMonth()]
          : a.ort;
        return '<button class="arch" data-arch="' + i + '">' +
          '<span class="em">' + a.emoji + "</span>" +
          '<span class="tx"><b>' + roh(a.titel) + "</b>" +
          "<span>" + roh(unten) + "</span></span></button>";
      }).join("") + "</div>" +
      '<button class="cta quiet" data-zu>Zurück</button>'
    );
    alle("#sheet [data-arch]").forEach(function (b) {
      b.addEventListener("click", function () {
        terminSheet(null, mo, liste[+b.dataset.arch], tag);
      });
    });
  }

  /* ---------- Termin anlegen und ändern -------------------------------
     Das Formular hat zwei Teile, und die Trennung ist der ganze Punkt:
     oben steht, was in Opas Woche landet — unten, was unter uns bleibt.
     Wer beides in ein Feld schreibt, schreibt früher oder später etwas
     in Opas Woche, was da nicht hingehört.
     ------------------------------------------------------------------ */
  var KATEGORIEN = [
    { k: "wasser", n: "Wasser" }, { k: "kaffee", n: "Kaffee" },
    { k: "runde",  n: "Runde"  }, { k: "rad",    n: "Rad"    },
    { k: "erzaehlen", n: "Erzählen" }, { k: "werk", n: "Draußen" }
  ];

  function terminSheet(vorhanden, mo, vorlage, wunschTag) {
    var neu = !vorhanden;
    var v = vorlage || {};

    /* Kommt der Vorschlag aus dem Katalog, hängt an ihm mehr als ein Titel:
       seine Kennung, sein fertiger WhatsApp-Text, sein Satz für danach. Das
       muss mitwandern, sonst stünde in der Nachricht nicht mehr, dass wir
       ihn anmelden — und genau das ist bei einem Angebot der Punkt. */
    var q = (v.sorte === "angebot" && v.quelle) ? v.quelle : null;

    /* Im gespeicherten Termin steht "·" für "macht er selbst". Im Formular
       heißt derselbe Fall "-", weil dort ein Knopf dahintersteht. Ohne die
       Umrechnung stand beim Ändern eines selbstgegangenen Termins gar kein
       Knopf gedrückt. */
    function knopfKuerzel(band, ersatz) {
      if (!band) return ersatz;
      return band.kuerzel === "\u00b7" ? "-" : band.kuerzel;
    }

    var s = neu
      ? { uid: kennung(), titel: v.titel || "", kategorie: v.kategorie || "kaffee",
          emoji: v.emoji || "", versatz: null,
          modus: v.tageszeit ? "tz" : "uhr",
          zeit: v.zeit || "15:00", tageszeit: v.tageszeit || "mittag",
          ort: v.ort || "", zusatz: v.zusatz || "",
          // Eine Kleinigkeit macht er allein — das ist ihr ganzes Wesen.
          // Da darf nicht als Voreinstellung "Papa holt dich ab" stehen.
          // Aus dem Archiv kann eine Vorlage kommen, die den Weg schon
          // kennt, weil sie aus einem echten Termin stammt. Dann zaehlt der.
          wer: v.sorte === "kleinigkeit" ? "-"
             : knopfKuerzel(v.abholung || (q && q.abholung), "P"),
          werText: (v.abholung && v.abholung.text) ||
                   (q && q.abholung ? q.abholung.text : ""),
          // Beim Rückweg ist "noch offen" die ehrliche Voreinstellung: bei
          // etwas Neuem hat darüber noch niemand nachgedacht. Nur wer allein
          // hingeht, kommt auch allein zurück.
          zurueck: v.sorte === "kleinigkeit" ? "-"
             : knopfKuerzel(v.rueckweg || (q && q.rueckweg), "?"),
          zurText: (v.rueckweg && v.rueckweg.text) ||
                   (q && q.rueckweg ? q.rueckweg.text : ""),
          intern: "" }
      : { uid: vorhanden.uid || kennung(), titel: vorhanden.titel,
          kategorie: vorhanden.kategorie,
          emoji: vorhanden.emoji || "",
          versatz: tageDazwischen(mo, ausIso(vorhanden.datum)),
          modus: vorhanden.zeit ? "uhr" : "tz",
          zeit: vorhanden.zeit || "15:00", tageszeit: vorhanden.tageszeit || "mittag",
          ort: vorhanden.ort || "",
          zusatz: vorhanden.zusatz || "",
          wer: knopfKuerzel(vorhanden.abholung, "P"),
          werText: vorhanden.abholung ? vorhanden.abholung.text : "",
          zurueck: knopfKuerzel(vorhanden.rueckweg, "?"),
          zurText: vorhanden.rueckweg ? vorhanden.rueckweg.text : "",
          intern: vorhanden.intern || "" };

    // Beim Anlegen auf den Tag, von dem aus das Blatt geöffnet wurde —
    // sonst auf den ersten, der noch nicht vorbei ist.
    if (s.versatz === null) {
      s.versatz = 0;
      if (wunschTag && tageDazwischen(new Date(), wunschTag) >= 0) {
        s.versatz = tageDazwischen(mo, wunschTag);
      } else {
        for (var i = 0; i < 7; i++) {
          if (tageDazwischen(new Date(), plusTage(mo, i)) >= 0) { s.versatz = i; break; }
        }
      }
    }

    var tage = "";
    for (var t = 0; t < 7; t++) {
      var tag = plusTage(mo, t);
      tage += '<button data-tag="' + t + '" aria-pressed="' + (t === s.versatz) + '"' +
        (tageDazwischen(new Date(), tag) < 0 ? " disabled" : "") + ">" +
        TAGE_KURZ[t] + "<br>" + tag.getDate() + "</button>";
    }
    var wer = INHALT.familie.map(function (p) {
      return '<button data-wer="' + p.kuerzel + '" aria-pressed="' + (s.wer === p.kuerzel) + '">' + p.name + "</button>";
    }).join("") + '<button data-wer="-" aria-pressed="' + (s.wer === "-") + '">Geht selbst</button>';
    var zurueck = INHALT.familie.map(function (p) {
      return '<button data-zur="' + p.kuerzel + '" aria-pressed="' + (s.zurueck === p.kuerzel) + '">' + p.name + "</button>";
    }).join("") +
      '<button data-zur="-" aria-pressed="' + (s.zurueck === "-") + '">Kommt allein</button>' +
      '<button data-zur="?" aria-pressed="' + (s.zurueck === "?") + '">Noch offen</button>';
    var farben = KATEGORIEN.map(function (c) {
      return '<button data-farbe="' + c.k + '" aria-pressed="' + (s.kategorie === c.k) +
        '" style="background:var(--c-' + c.k + ')" aria-label="' + c.n + '"></button>';
    }).join("");

    sheetAuf(
      '<div class="kicker">' + mo.getDate() + ". " + MON_KURZ[mo.getMonth()] + " – " +
        plusTage(mo, 6).getDate() + ". " + MON_KURZ[plusTage(mo, 6).getMonth()] + "</div>" +
      "<h3>" + (neu ? "Etwas eintragen" : "Ändern") + "</h3>" +

      '<div class="abschnitt erst"><h5>Was Opa sieht</h5></div>' +
      '<div class="feld"><label>Zeichen und was</label><div class="zeile">' +
        '<input id="t-emoji" class="emj" value="' + roh(s.emoji) + '" maxlength="4" ' +
          'aria-label="Zeichen" placeholder="' + zeichenVon({ kategorie: s.kategorie }) + '">' +
        '<input id="t-titel" value="' + roh(s.titel) +
          '" placeholder="Zum Beispiel: Eis essen mit Oma"></div></div>' +
      '<div class="feld"><label>Tag</label><div class="wahl" id="t-tag">' + tage + "</div></div>" +

      // Uhrzeit oder Tageszeit. Eine Kleinigkeit braucht keine Minute, und
      // eine zu verlangen macht aus ihr eine Verabredung, die sie nicht ist.
      '<div class="feld"><label>Wann</label><div class="wahl" id="t-modus">' +
        '<button data-modus="uhr" aria-pressed="' + (s.modus === "uhr") + '">Feste Uhrzeit</button>' +
        '<button data-modus="tz" aria-pressed="' + (s.modus === "tz") + '">Nur Tageszeit</button>' +
        "</div></div>" +
      '<div class="feld" id="t-uhrfeld"' + (s.modus === "uhr" ? "" : " hidden") + ">" +
        '<input type="time" id="t-zeit" value="' + roh(s.zeit) + '"></div>' +
      '<div class="feld" id="t-tzfeld"' + (s.modus === "tz" ? "" : " hidden") + ">" +
        '<div class="wahl" id="t-tz">' +
          '<button data-tz="frueh" aria-pressed="' + (s.tageszeit === "frueh") + '">Vormittags</button>' +
          '<button data-tz="mittag" aria-pressed="' + (s.tageszeit === "mittag") + '">Nachmittags</button>' +
          '<button data-tz="abend" aria-pressed="' + (s.tageszeit === "abend") + '">Abends</button>' +
        "</div></div>" +
      '<div class="feld"><label>Wo</label><input id="t-ort" value="' + roh(s.ort) +
        '" placeholder="Zum Beispiel: Eisdiele am Markt"></div>' +
      '<div class="feld"><label>Ein Satz dazu</label><textarea id="t-zusatz" rows="2" ' +
        'placeholder="Was ihn erwartet. Ruhig kurz.">' + roh(s.zusatz) + "</textarea></div>" +
      // Zwei Wege, zwei Fragen. Vorher stand hier nur "Wer holt ihn ab" —
      // gemeint war die Fahrt von zu Hause weg, und wie er wieder heimkommt,
      // stand nirgends. Für ihn ist das die wichtigere Hälfte.
      '<div class="feld"><label>Hin — wer holt ihn zu Hause ab</label>' +
        '<div class="wahl" id="t-wer">' + wer + "</div></div>" +
      '<div class="feld"><label>Und wann</label><input id="t-wertext" value="' + roh(s.werText) +
        '" placeholder="um 14:10 vor der Tür"></div>' +
      '<div class="feld"><label>Zurück — wer holt ihn dort wieder ab</label>' +
        '<div class="wahl breit" id="t-zur">' + zurueck + "</div></div>" +
      '<div class="feld"><label>Und wann</label><input id="t-zurtext" value="' + roh(s.zurText) +
        '" placeholder="gegen 16:20"></div>' +
      '<div class="feld"><label>Farbe im Buch</label><div class="farben" id="t-farbe">' + farben + "</div></div>" +

      '<div class="abschnitt"><h5>Unter uns</h5>' +
        "<p>Sieht nur die Familie. Steht nie in Opas Woche.</p></div>" +
      '<div class="feld"><textarea id="t-intern" rows="2" ' +
        'placeholder="Wer ruft dort an? Was sollten wir wissen?">' + roh(s.intern) + "</textarea></div>" +

      '<button class="cta" id="t-ok"' + (s.titel.trim().length < 2 ? " disabled" : "") + ">Speichern</button>" +
      '<button class="cta quiet" data-zu>Abbrechen</button>' +
      (neu ? "" : '<button class="loeschen" id="t-weg">Diesen Termin löschen</button>')
    );

    // Tippen wird direkt gemerkt, ohne das Blatt neu zu zeichnen — sonst
    // springt die Tastatur zu und der Blattanfang wieder nach oben.
    function tippt(id, feld, dann) {
      var el = $(id);
      el.addEventListener("input", function () { s[feld] = el.value; if (dann) dann(); });
    }
    tippt("t-titel", "titel", function () { $("t-ok").disabled = s.titel.trim().length < 2; });
    tippt("t-emoji", "emoji");
    tippt("t-zeit", "zeit");
    tippt("t-ort", "ort");
    tippt("t-zusatz", "zusatz");
    tippt("t-wertext", "werText");
    tippt("t-zurtext", "zurText");
    tippt("t-intern", "intern");

    function gruppe(id, feld, wert, dann) {
      alle("#" + id + " button").forEach(function (b) {
        b.addEventListener("click", function () {
          if (b.disabled) return;
          s[feld] = wert(b);
          alle("#" + id + " button").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
          b.setAttribute("aria-pressed", "true");
          if (dann) dann();
        });
      });
    }
    gruppe("t-tag", "versatz", function (b) { return +b.dataset.tag; });
    gruppe("t-wer", "wer", function (b) { return b.dataset.wer; });
    gruppe("t-zur", "zurueck", function (b) { return b.dataset.zur; });
    gruppe("t-tz", "tageszeit", function (b) { return b.dataset.tz; });
    gruppe("t-modus", "modus", function (b) { return b.dataset.modus; }, function () {
      $("t-uhrfeld").hidden = s.modus !== "uhr";
      $("t-tzfeld").hidden = s.modus !== "tz";
    });
    // Das Zeichen folgt der Farbe, solange niemand ein eigenes gesetzt hat.
    gruppe("t-farbe", "kategorie", function (b) { return b.dataset.farbe; }, function () {
      $("t-emoji").placeholder = zeichenVon({ kategorie: s.kategorie });
    });

    $("t-ok").addEventListener("click", function () {
      var tag = plusTage(mo, s.versatz);
      var person = INHALT.familie.filter(function (p) { return p.kuerzel === s.wer; })[0];
      var personZ = INHALT.familie.filter(function (p) { return p.kuerzel === s.zurueck; })[0];
      var mitUhr = s.modus === "uhr";
      var tz = TAGESZEIT[s.tageszeit] || TAGESZEIT.mittag;
      // Ab wann "Wie war's?" erscheinen darf. Bei einer Uhrzeit drei Stunden
      // später, bei einer Tageszeit am Ende dieser Tageszeit.
      var stunde = mitUhr
        ? Math.min(23, (+String(s.zeit).split(":")[0] || 15) + 3)
        : tz.bis;
      var obj = {
        // Ein Angebot aus dem Katalog bleibt ein Angebot, auch wenn man die
        // Uhrzeit ändert — sonst stünde im WhatsApp-Text nicht mehr, dass
        // wir ihn anmelden.
        uid: s.uid, id: (vorhanden && vorhanden.id) || (q ? q.id : "eig"),
        datum: iso(tag),
        zeit: mitUhr ? s.zeit : "", tageszeit: mitUhr ? "" : s.tageszeit,
        gewesenAb: stunde,
        titel: s.titel.trim(), kategorie: s.kategorie,
        emoji: s.emoji.trim() || zeichenVon({ kategorie: s.kategorie }),
        ort: s.ort.trim() || "bei euch", zusatz: s.zusatz.trim(),
        intern: s.intern.trim(),
        /* Holt ihn niemand ab, gibt es nichts zu organisieren — dann stand
           im Band bisher "Wann du magst / am Vormittag", und das wiederholt
           nur die Zeile darüber. Die Karte fiel damit sichtbar ab gegenüber
           einer mit Treffpunkt und Uhrzeit, und genau das soll sie nicht:
           die Kleinigkeit ist gleich viel wert.
           Also steht dort jetzt der Satz, der sagt, worum es geht. */
        abholung: person
          ? { kuerzel: person.kuerzel, titel: person.satz || (person.name + " holt dich ab"),
              text: s.werText.trim() || "Zeit sagen wir noch" }
          : (mitUhr
              ? { kuerzel: "·", titel: "Du gehst selbst hin",
                  text: s.werText.trim() || s.zusatz.trim() || "wie besprochen" }
              : { kuerzel: "·", titel: "Wann du magst",
                  text: s.werText.trim() || s.zusatz.trim() || tz.satz }),
        // Der Rückweg. Steht er noch offen, bleibt hier null — und genau
        // das ist die Aussage: in Opas Woche steht dann nichts dazu, und
        // bei uns im Tagesblatt steht "Rückweg offen", bis es geklärt ist.
        rueckweg: personZ
          ? { kuerzel: personZ.kuerzel,
              titel: personZ.satzZurueck || (personZ.name + " bringt dich zurück"),
              text: s.zurText.trim() || "Zeit sagen wir noch" }
          : s.zurueck === "-"
            ? { kuerzel: "\u00b7", titel: "Du kommst allein zurück",
                text: s.zurText.trim() || "wie besprochen" }
            : null,
        danach: (vorhanden && vorhanden.danach) || (q && q.danach) ||
                { titel: "Warst du. Schön.", text: "" }
      };
      // Der fertige Text eines Angebots wandert mit. Bei etwas Eigenem gibt
      // es keinen — der Text wird dann aus dem Termin selbst gebaut.
      var vorlagenText = (vorhanden && vorhanden.textVorlage) || (q ? q.text : null);
      if (vorlagenText) obj.textVorlage = vorlagenText;
      // Ein geänderter Beispieltermin wird dabei zu einem echten Termin.
      if (vorhanden && !vorhanden.uid) {
        geloescht.push(schluessel(vorhanden));
        schreib("geloescht", geloescht);
      }
      eigene = eigene.filter(function (x) { return x.uid !== obj.uid; });
      eigene.push(obj);
      schreib("eigene", eigene);

      // Wer einen abgesagten Termin neu setzt, holt ihn damit zurück. Alles
      // andere wäre unehrlich: der Termin steht dann ja wieder.
      var warAbgesagt = abgesagt.indexOf(obj.uid) >= 0;
      if (warAbgesagt) {
        abgesagt = abgesagt.filter(function (x) { return x !== obj.uid; });
        schreib("abgesagt", abgesagt);
      }

      entwurf = { titel: "WhatsApp an Opa", text: whatsappText(obj) };
      neueMitteilung({ von: person ? person.kuerzel : "P",
        titel: (warAbgesagt ? "Neu gelegt: " : neu ? "Neu geplant: " : "Geändert: ") + obj.titel,
        text: tagLang(tag) + ", " + tag.getDate() + ". " + MON_KURZ[tag.getMonth()] + " " + zeitSatz(obj) + "." });
      sheetZu();
      zeichneAlles();
    });

    var weg = $("t-weg");
    if (weg) weg.addEventListener("click", function () {
      geloescht.push(schluessel(vorhanden));
      schreib("geloescht", geloescht);
      eigene = eigene.filter(function (x) { return schluessel(x) !== schluessel(vorhanden); });
      schreib("eigene", eigene);
      neueMitteilung({ von: "P", titel: "Wieder herausgenommen: " + vorhanden.titel,
        text: tagLang(ausIso(vorhanden.datum)) + " ist wieder frei." });
      sheetZu();
      zeichneAlles();
    });
  }

  /* ---------- Werkbank ---------- */
  function zeichneWerkbank() {
    var zustaende = [
      { k: "",         n: "Echter Stand" },
      { k: "gewesen",  n: "Als wär's gewesen" },
      { k: "abgesagt", n: "Als hätt er abgesagt" },
      { k: "leer",     n: "Als wär nichts geplant" }
    ];
    var angemeldet = !!(auth && KONTO);
    $("werkbank").innerHTML = zustaende.map(function (z) {
      return '<button class="wb" data-z="' + z.k + '" aria-pressed="' + (werkbank === z.k) + '">' + z.n + "</button>";
    }).join("") +
      (angemeldet
        ? '<button class="wb" data-ab="1">Abmelden</button>'
        : '<button class="wb" data-rolle="1">Als Opas Gerät ansehen</button>') +
      '<button class="wb" data-reset="1">Alles zurücksetzen</button>' +
      '<p style="margin:9px 0 0;font-size:11.5px;color:var(--faint);font-weight:500;line-height:1.4">' +
      (angemeldet
        ? "Angemeldet als <b>" + roh(KONTO.email) + "</b> · Rolle <b>" + roh(ROLLE || "—") + "</b>."
        : "Kein Server. Dieses Gerät ist gerade: <b>" + (ROLLE === "user" ? "Opas Gerät" : "Familie") +
          "</b> — umschalten mit <b>?rolle=user</b> bzw. <b>?rolle=admin</b> in der Adresse.") + "</p>";

    Array.prototype.forEach.call($("werkbank").querySelectorAll("button"), function (b) {
      b.addEventListener("click", function () {
        if (b.dataset.ab) { abmelden(); return; }
        if (b.dataset.rolle) {
          try { localStorage.setItem("ow.rolle", "user"); } catch (e) {}
          location.search = "?rolle=user";
          return;
        }
        if (b.dataset.reset) {
          try {
            ["gelesen","abgesagt","gruende","erledigt","eigene","geloescht","extraMit","erlebt","fotos"]
              .forEach(function (k) { localStorage.removeItem("ow." + k); });
          } catch (e) {}
          gelesen = []; abgesagt = []; gruende = {}; erledigt = [];
          eigene = []; geloescht = []; extraMit = []; erlebt = []; fotos = {};
          werkbank = ""; entwurf = null;
          zeichneAlles();
          return;
        }
        werkbank = b.dataset.z;
        zeichneAlles();
      });
    });
  }

  /* ---------- Kopieren ---------- */
  var kopierUhr = null;

  function zuruecksetzenKopieren() {
    clearTimeout(kopierUhr);
    var b = $("kopieren");
    b.textContent = "Text kopieren";
    b.classList.remove("fertig");
  }

  function inZwischenablage(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (ok, nein) {
      var t = document.createElement("textarea");
      t.value = text;
      t.setAttribute("readonly", "");
      t.style.cssText = "position:absolute;left:-9999px";
      document.body.appendChild(t);
      t.select();
      t.setSelectionRange(0, text.length);
      var g = false;
      try { g = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(t);
      g ? ok() : nein();
    });
  }

  $("kopieren").addEventListener("click", function () {
    var b = this;
    inZwischenablage($("draft").textContent).then(function () {
      b.textContent = "Kopiert ✓";
      b.classList.add("fertig");
      clearTimeout(kopierUhr);
      kopierUhr = setTimeout(zuruecksetzenKopieren, 2500);
    }).catch(function () {
      b.textContent = "Ging nicht — Text antippen und halten";
      clearTimeout(kopierUhr);
      kopierUhr = setTimeout(zuruecksetzenKopieren, 3500);
    });
  });

  /* ---------- Reiter ---------- */
  var tabs = document.querySelectorAll(".tab");
  Array.prototype.forEach.call(tabs, function (t) {
    t.addEventListener("click", function () {
      Array.prototype.forEach.call(tabs, function (o) {
        o.setAttribute("aria-selected", "false");
        $(o.dataset.p).hidden = true;
        $(o.dataset.p).classList.remove("zeigen");
      });
      t.setAttribute("aria-selected", "true");
      // Wer den Reiter wechselt, kommt auf heute zurück.
      if (blick) { blick = null; zeichneWoche(); }
      var pane = $(t.dataset.p);
      pane.hidden = false;
      void pane.offsetWidth;                 // Animation neu auslösen
      pane.classList.add("zeigen");
      pane.querySelector(".scroll").scrollTop = 0;
      sheetZu();
    });
  });

  $("hero").addEventListener("click", function () {
    if (imFokus) ereignisSheet(imFokus);
  });

  alle("[data-glocke]").forEach(function (b) {
    b.addEventListener("click", mitteilungenSheet);
  });

  /* ---------- Los ---------- */
  function zeichneAlles() {
    zeichneWoche();
    zeichneBuch();
    zeichneFamilie();
    zeichneGlocken();
  }

  // Opas Gerät kennt Familie nicht. Zwei Reiter statt drei — für ihn
  // ist das nicht weniger, sondern weniger im Weg.
  function rolleAnwenden() {
    var opa = ROLLE === "user";
    var famTab = document.querySelector('.tab[data-p="p-fam"]');
    if (famTab) { famTab.hidden = opa; famTab.setAttribute("aria-selected", "false"); }
    if (opa) {
      $("p-fam").hidden = true;
      $("p-book").hidden = true;
      document.querySelector('.tab[data-p="p-book"]').setAttribute("aria-selected", "false");
      document.querySelector('.tab[data-p="p-week"]').setAttribute("aria-selected", "true");
      $("p-week").hidden = false;
    }
  }

  // Ab hier läuft die App wirklich los — erst, wenn feststeht, wer da ist.
  function starten() {
    rolleAnwenden();
    gesichter();
    zeichneBuch();
    zeichneAlles();
  }

  if (firebaseDa()) {
    firebaseStart();
  } else {
    ROLLE = entwicklerRolle();
    starten();
  }

  // Wenn die App im Hintergrund lag und wieder geöffnet wird: Datum nachziehen.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden || !ROLLE) return;
    blick = null;              // Wieder aufgemacht heisst: wieder bei heute.
    blickMonat = null;         // Auch das Raster steht dann wieder im laufenden Monat.
    zeichneAlles();
  });
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
