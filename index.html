  /* ---------- Werkbank: Zustände durchspielen (nur fuer uns) ---------- */
  var werkbank = "";   // "", "gewesen", "abgesagt", "leer"

  /* ---------- Sheet ---------- */
  var sheet = $("sheet"), scrim = $("scrim");
  function sheetZu() { sheet.hidden = true; scrim.hidden = true; }
  function sheetAuf(inhaltHtml) {
    sheet.innerHTML = '<div class="grip"></div>' + inhaltHtml;
    sheet.hidden = false;
    scrim.hidden = false;
    sheet.scrollTop = 0;
    var zu = sheet.querySelector("[data-zu]");
    if (zu) zu.addEventListener("click", sheetZu);
  }
  scrim.addEventListener("click", sheetZu);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") sheetZu(); });

  /* ---------- Gesichter ---------- */
  function gesichter() {
    alle("[data-opa]").forEach(function (el) {
      if (!INHALT.opaFoto) { el.textContent = "O"; return; }
      el.classList.add("foto");
      var img = new Image();
      img.alt = "Opa";
      img.onerror = function () { el.classList.remove("foto"); el.textContent = "O"; };
      img.src = INHALT.opaFoto;
      el.textContent = "O";
      el.appendChild(img);
    });
    $("faces").innerHTML = INHALT.familie.map(function (p) {
      return '<div class="face ' + p.farbe + '">' + p.kuerzel + "</div>";
    }).join("");
  }

  /* ---------- Woche ---------- */
  function abstandText(e, gewesen) {
    var d = ausIso(e.datum);
    var diff = tageDazwischen(new Date(), d);
    if (gewesen) return diff === 0 ? "Heute gewesen" : "War am " + tagLang(d);
    if (diff === 0) return "Heute";
    if (diff === 1) return "Morgen";
    if (diff < 7)  return "In " + diff + " Tagen";
    if (diff < 14) return "Nächste Woche";
    return "In " + Math.round(diff / 7) + " Wochen";
  }

  /* Welchen Tag schaut er gerade an?
     null heisst: den Standard, also das nächste, was ansteht. Tippt er im
     Streifen auf einen anderen Tag, steht hier entweder dessen Termin
     ({key}) oder, wenn dort nichts ist, der Tag selbst ({tag}).
     Beim Tipp auf heute, beim Reiterwechsel und beim Wiederöffnen der App
     fällt es auf null zurück: Herumschauen ist ein Ausflug, kein Zustand. */
  var blick = null;      // {key: …} oder {tag: …} oder null
  var imFokus = null;    // der Termin, den die grosse Karte gerade zeigt

  // Nur die sieben Tage im Streifen sind erreichbar. Was herausrutscht
  // (weil die App über Nacht offen lag), gilt nicht mehr.
  function imStreifen(d) {
    var ab = tageDazwischen(new Date(), d);
    return ab >= 0 && ab < 7;
  }
  function terminZu(s) {
    var t = alleTermine().filter(function (x) { return schluessel(x) === s; })[0];
    return (t && imStreifen(ausIso(t.datum))) ? t : null;
  }
  function tagImStreifen(s) {
    var d = ausIso(s);
    return imStreifen(d) ? d : null;
  }

  /* "Heute", "Morgen", "In 4 Tagen" — mehr braucht es im Streifen nicht,
     weil dort ohnehin nur sieben Tage liegen. */
  function wannKurz(d) {
    var diff = tageDazwischen(new Date(), d);
    return diff === 0 ? "Heute" : diff === 1 ? "Morgen" : "In " + diff + " Tagen";
  }

  function zeichneWoche() {
    var heute = new Date();
    $("anrede").textContent = INHALT.anrede;
    $("heute-zeile").textContent = langesDatum(heute);

    var e = null, leerTag = null;
    if (werkbank !== "leer") {
      if (blick && blick.key) {
        e = terminZu(blick.key);
        if (!e) blick = null;
      } else if (blick && blick.tag) {
        leerTag = tagImStreifen(blick.tag);
        if (!leerTag) blick = null;
      }
      if (!e && !leerTag) e = aktuell();
    }
    imFokus = e;

    var gewesen = !!e && (werkbank === "gewesen" || schonVorbei(e));
    var weg     = !!e && (werkbank === "abgesagt" || istAbgesagt(e));
    var innen   = document.querySelector("#hero .inner");

    $("hero").classList.toggle("stumm", !e || weg);
    innen.style.background = "";

    if (leerTag) {
      // Ein Tag, an dem nichts ansteht. Dasselbe Bild wie sonst, nur auf
      // diesen Tag bezogen — damit jeder Tipp im Streifen dasselbe tut.
      $("art").innerHTML = motiv("still");
      $("chip").textContent = wannKurz(leerTag);
      $("hero-titel").textContent = "Nichts vorgesehen";
      $("hero-meta").textContent = langesDatum(leerTag);
      $("band").className = "band";
      $("band-ic").textContent = "·";
      $("band-titel").textContent = INHALT.leer.band.titel;
      $("band-text").textContent = INHALT.leer.band.text;
    } else if (!e) {
      $("art").innerHTML = motiv("still");
      $("chip").textContent = "Nichts vorgesehen";
      $("hero-titel").textContent = INHALT.leer.titel;
      $("hero-meta").textContent = INHALT.leer.meta;
      $("band").className = "band";
      $("band-ic").textContent = "·";
      $("band-titel").textContent = INHALT.leer.band.titel;
      $("band-text").textContent = INHALT.leer.band.text;
    } else if (weg) {
      $("art").innerHTML = motiv("still");
      $("chip").textContent = "Abgesagt";
      $("hero-titel").textContent = e.titel;
      $("hero-meta").textContent = tagLang(ausIso(e.datum)) + " " + e.zeit + " · abgesagt";
      $("band").className = "band";
      $("band-ic").textContent = "·";
      $("band-titel").textContent = "Die Familie weiß Bescheid";
      $("band-text").textContent = "Wir suchen etwas anderes";
    } else {
      $("art").innerHTML = gewesen ? motivKamera() : motiv(e.kategorie);
      innen.style.background = gewesen ? "var(--c-rad)" : "var(--c-" + e.kategorie + ")";
      $("chip").textContent = abstandText(e, gewesen);
      $("hero-titel").textContent = e.titel;
      $("hero-meta").textContent = gewesen
        ? tagLang(ausIso(e.datum)) + " · war um " + e.zeit
        : tagLang(ausIso(e.datum)) + " " + e.zeit + " · " + e.ort;
      var band = gewesen ? e.danach : e.abholung;
      $("band").className = "band" + (gewesen ? " fertig" : "");
      $("band-ic").textContent = gewesen ? "✓" : e.abholung.kuerzel;
      $("band-titel").textContent = band.titel;
      $("band-text").textContent = band.text;
    }

    zeichneStreifen(leerTag ? iso(leerTag) : (e ? e.datum : null));
    zeichneAktion(e, gewesen, weg);
    zeichneRail();
  }

  /* Die nächsten sieben Tage, heute zuerst.
       Oranger Rahmen, oranger Punkt = da steht etwas an.
       Grauer Rahmen, grauer Punkt   = da war etwas, es ist abgesagt.
       Grosse Zahl                   = das ist der Tag, den die Karte zeigt.
     Der angeschaute Tag bekommt mit Absicht keine eigene Farbe: in einer
     Reihe aus sieben Kaesten waeren drei Farbbedeutungen zu viel. Die Zahl
     waechst stattdessen — das sieht man auch aus dem Augenwinkel.
     Jeder Tipp tut dasselbe: er wechselt die Karte oben. Auch an Tagen,
     an denen nichts ansteht. Heute fuehrt immer zurueck zum Standard. */
  function zeichneStreifen(fokusDatum) {
    var heute = new Date();
    var termine = alleTermine();
    var html = "";

    function amTag(tag) {
      return termine.filter(function (x) { return x.datum === iso(tag); });
    }

    for (var i = 0; i < 7; i++) {
      var tag = plusTage(heute, i);
      var hat = amTag(tag);
      var offen = hat.filter(function (x) { return !istAbgesagt(x); });
      var k = "wd" + (i === 0 ? " today" : "");
      if (offen.length) k += " event";
      else if (hat.length) k += " weg";
      if (fokusDatum && iso(tag) === fokusDatum) k += " blick";
      html += '<button class="' + k + '" data-tag="' + i + '">' +
        '<span class="dot"><i></i></span><b>' + tagKurz(tag) + "</b>" +
        '<span class="num">' + tag.getDate() + "</span></button>";
    }
    $("week").innerHTML = html;

    Array.prototype.forEach.call($("week").children, function (el) {
      el.addEventListener("click", function () {
        var n = +el.dataset.tag;
        // Heute ist der Weg zurueck. Der Kasten steht immer vorne und ist
        // immer da — deshalb braucht es keine zusaetzliche Zurueck-Taste.
        if (n === 0) { blick = null; zeichneWoche(); return; }
        var tag = plusTage(new Date(), n);
        var hat = amTag(tag);
        if (hat.length > 1) { tagSheet(tag, hat); return; }
        blick = hat.length ? { key: schluessel(hat[0]) } : { tag: iso(tag) };
        zeichneWoche();
      });
    });
  }

  function zeichneAktion(e, gewesen, weg) {
    var ziel = $("aktion");
    ziel.innerHTML = "";
    if (!e) return;

    // Nichts mehr zu tun: der Tag ist vorbei, oder die Rückmeldung steht schon.
    if (weg && gewesen) return;
    if (gewesen && istErledigt(e)) return;

    if (weg) {
      ziel.innerHTML = '<button class="cta" id="doch">Doch, ich gehe hin</button>';
      $("doch").addEventListener("click", function () {
        var s = schluessel(e);
        abgesagt = abgesagt.filter(function (x) { return x !== s; });
        schreib("abgesagt", abgesagt);
        neueMitteilung({ von: "!", titel: "Doch zugesagt",
          text: e.titel + " steht wieder. Die Familie weiß Bescheid." });
        werkbank = "";
        zeichneAlles();
      });
      return;
    }
    if (gewesen) {
      ziel.innerHTML = '<button class="cta" id="wie-wars">Wie war\'s?</button>';
      $("wie-wars").addEventListener("click", function () { rueckmeldungSheet(e); });
      return;
    }
    ziel.innerHTML = '<button class="cta leise" id="passt-nicht">Passt mir doch nicht</button>';
    $("passt-nicht").addEventListener("click", function () { absageSheet(e); });
  }

  /* Das Buch ist keine feste Liste mehr. Jede Rückmeldung wird eine Seite —
     mit Foto, wenn eins dabei war, sonst mit Farbe. Die alten Einträge aus
     INHALT hängen als Vergangenheit hinten dran. */
  function buchSeiten() {
    var meine = erlebt.slice().sort(function (a, b) {
      return a.datum < b.datum ? 1 : a.datum > b.datum ? -1 : 0;
    }).map(function (x) {
      var d = ausIso(x.datum);
      var kat = x.kategorie === "erzaehlen" ? "erz" : (x.kategorie || "werk");
      return {
        monat: MONATE[d.getMonth()],
        titel: x.titel,
        farbe: "e-" + kat,
        foto: "ph-1",
        fotoId: x.fotoId,
        reaktionen: BEWERTUNG[(x.bewertung || 4) - 1] +
          (x.notiz ? " · „" + x.notiz + "“" : "") +
          (x.fotoId ? " · mit Foto" : ""),
        art: "neu"
      };
    });
    return meine.concat(INHALT.buch);
  }

  function phKlasse(b) { return "ph " + (b.fotoId && fotos[b.fotoId] ? "echt" : b.foto); }
  function phStil(b)  { return b.fotoId && fotos[b.fotoId] ? ' style="background-image:url(' + fotos[b.fotoId] + ')"' : ""; }

  function zeichneRail() {
    var seiten = buchSeiten();
    $("buch-zahl").textContent = seiten.length + " Seiten";
    $("rail").innerHTML = seiten.slice(0, 5).map(function (b, i) {
      return '<button class="tile tap" data-b="' + i + '">' +
        '<div class="' + phKlasse(b) + '"' + phStil(b) + "></div><b>" + roh(b.titel) + "</b>" +
        "<small>" + b.monat + "</small></button>";
    }).join("");
    Array.prototype.forEach.call($("rail").children, function (el) {
      el.addEventListener("click", function () { buchSheet(seiten[+el.dataset.b]); });
    });
  }

  /* ---------- Sheets ---------- */
  function tagSheet(tag, liste) {
    sheetAuf(
      '<div class="kicker">' + langesDatum(tag) + "</div>" +
      "<h3>Was an dem Tag ansteht</h3>" +
      liste.map(function (x, i) {
        return '<button class="cta' + (i ? " quiet" : "") + '" data-x="' + i + '">' +
          roh(x.titel) + " · " + roh(x.zeit) + (istAbgesagt(x) ? " · abgesagt" : "") + "</button>";
      }).join("") +
      '<button class="cta quiet" data-zu>Zurück</button>'
    );
    alle("#sheet [data-x]").forEach(function (b) {
      b.addEventListener("click", function () {
        blick = { key: schluessel(liste[+b.dataset.x]) };
        sheetZu();
        zeichneWoche();
      });
    });
  }

  function ereignisSheet(e) {
    if (!e) return;
    var d = ausIso(e.datum), gewesen = schonVorbei(e), weg = istAbgesagt(e);
    sheetAuf(
      '<div class="kicker">' + (weg ? "Abgesagt" : abstandText(e, gewesen)) + "</div>" +
      "<h3>" + roh(e.titel) + "</h3>" +
      "<p>" + langesDatum(d) + " um " + roh(e.zeit) + " Uhr · " + roh(e.ort) + "</p>" +
      "<p>" + roh(e.zusatz) + "</p>" +
      (weg ? "" : "<p>" + (gewesen ? e.danach.titel : e.abholung.titel + " " + e.abholung.text) + "</p>") +
      (gewesen && !weg ? '<button class="cta" id="sheet-wie">Wie war\'s?</button>' : "") +
      (!gewesen && !weg ? '<button class="cta quiet" id="sheet-nein">Passt mir doch nicht</button>' : "") +
      '<button class="cta quiet" data-zu>Zurück</button>'
    );
    var a = $("sheet-wie");  if (a) a.addEventListener("click", function () { rueckmeldungSheet(e); });
    var b = $("sheet-nein"); if (b) b.addEventListener("click", function () { absageSheet(e); });
  }

  /* Absagen. Das Wichtigste dabei: Opa muss sehen, dass sein Tippen
     etwas bewirkt hat — und es zurücknehmen können. */
  function absageSheet(e) {
    sheetAuf(
      "<h3>Passt dir nicht?</h3>" +
      "<p>Schreib kurz, warum. Dann wissen wir, was wir stattdessen suchen sollen.</p>" +
      '<textarea class="grund" id="grund" rows="3" placeholder="Zum Beispiel: Ich habe etwas anderes vor."></textarea>' +
      '<button class="cta" id="ja-absagen" disabled>Absagen</button>' +
      '<button class="cta quiet" data-zu>Doch, passt schon</button>' +
      // Ausweg fuer den Tag, an dem das Tippen nicht geht. Ohne den
      // wuerde er im Zweifel gar nicht absagen und einfach nicht hingehen.
      '<button class="klein" id="statt-schreiben">Ich kann gerade nicht schreiben — ruft mich an</button>'
    );
    var feld = $("grund"), knopf = $("ja-absagen");
    feld.addEventListener("input", function () {
      knopf.disabled = feld.value.trim().length < 3;
    });
    knopf.addEventListener("click", function () { absagen(e, feld.value.trim()); });
    $("statt-schreiben").addEventListener("click", function () { absagen(e, "Bitte ruft mich an."); });
  }

  function absagen(e, grund) {
    abgesagt.push(schluessel(e));
    schreib("abgesagt", abgesagt);
    gruende[schluessel(e)] = grund;
    schreib("gruende", gruende);
    neueMitteilung({ von: "!", titel: "Abgesagt: " + e.titel, text: grund });
    werkbank = "";
    // Die Karte bleibt auf dem abgesagten Termin stehen, damit er sieht,
    // dass sein Tippen angekommen ist. Beim nächsten Öffnen steht dort
    // wieder das Nächste, was ansteht — der graue Punkt bleibt.
    blick = { key: schluessel(e) };
    sheetAuf(
      "<h3>Ist abgesagt</h3>" +
      "<p>Wir melden uns mit etwas anderem. Du musst nichts weiter tun.</p>" +
      '<button class="cta quiet" data-zu>Gut</button>'
    );
    zeichneAlles();
  }

  /* ---------- Foto: aussuchen, verkleinern, behalten ---------- */
  // Ein Handyfoto hat mehrere Megabyte. So gross passt es nirgends hin und
  // waere fuer eine Buchseite auch Unsinn. Deshalb wird es vor dem Speichern
  // auf 800 Pixel gerechnet — das reicht fuer Bildschirm und Druck.
  function verkleinern(datei, fertig) {
    var leser = new FileReader();
    leser.onerror = function () { fertig(null); };
    leser.onload = function () {
      var bild = new Image();
      bild.onerror = function () { fertig(null); };
      bild.onload = function () {
        var max = 800;
        var s = Math.min(1, max / Math.max(bild.width, bild.height));
        var c = document.createElement("canvas");
        c.width = Math.round(bild.width * s);
        c.height = Math.round(bild.height * s);
        c.getContext("2d").drawImage(bild, 0, 0, c.width, c.height);
        try { fertig(c.toDataURL("image/jpeg", 0.72)); }
        catch (e) { fertig(null); }
      };
      bild.src = leser.result;
    };
    leser.readAsDataURL(datei);
  }

  function fotoAussuchen(fertig) {
    var inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "image/*";
    inp.style.cssText = "position:absolute;left:-9999px";
    document.body.appendChild(inp);
    inp.addEventListener("change", function () {
      var d = inp.files && inp.files[0];
      if (inp.parentNode) document.body.removeChild(inp);
      if (!d) { fertig(null); return; }
      verkleinern(d, fertig);
    });
    inp.click();
  }

  /* ---------- Wie war's — und daraus wird die Buchseite ---------- */
  function rueckmeldungSheet(e) {
    var stand = { bewertung: 4, notiz: "", fotoId: null, fehler: "" };

    function zeichnen() {
      sheetAuf(
        '<div class="kicker">' + langesDatum(ausIso(e.datum)) + "</div>" +
        "<h3>Wie war's?</h3>" +
        '<div class="regler">' +
          '<input type="range" id="bew" min="1" max="5" step="1" value="' + stand.bewertung +
          '" aria-label="Wie war es"><b id="bew-text">' + BEWERTUNG[stand.bewertung - 1] + "</b>" +
        "</div>" +
        (stand.fotoId
          ? '<div class="bild ph echt" style="background-image:url(' + fotos[stand.fotoId] + ')"></div>' +
            '<button class="klein" id="foto-weg">Foto wieder wegnehmen</button>'
          : '<button class="cta quiet" id="foto">Foto dazu</button>') +
        (stand.fehler ? '<p style="color:var(--accent);font-weight:600">' + stand.fehler + "</p>" : "") +
        '<textarea class="grund" id="notiz" rows="2" placeholder="Magst du etwas dazuschreiben? Musst du nicht.">' +
          stand.notiz + "</textarea>" +
        '<button class="cta" id="ins-buch">Ins Buch</button>' +
        '<button class="cta quiet" data-zu>Später</button>'
      );

      var regler = $("bew");
      regler.addEventListener("input", function () {
        stand.bewertung = +regler.value;
        $("bew-text").textContent = BEWERTUNG[stand.bewertung - 1];
      });

      var notiz = $("notiz");
      notiz.addEventListener("input", function () { stand.notiz = notiz.value; });

      var fotoKnopf = $("foto");
      if (fotoKnopf) fotoKnopf.addEventListener("click", function () {
        fotoAussuchen(function (bild) {
          if (!bild) { stand.fehler = "Das Bild ließ sich nicht laden."; zeichnen(); return; }
          var id = "f" + Date.now();
          var kopie = {}; for (var k in fotos) kopie[k] = fotos[k];
          kopie[id] = bild;
          if (!schreibSicher("fotos", kopie)) {
            stand.fehler = "Auf dem Gerät ist kein Platz mehr für Fotos.";
          } else {
            fotos = kopie; stand.fotoId = id; stand.fehler = "";
          }
          zeichnen();
        });
      });

      var weg = $("foto-weg");
      if (weg) weg.addEventListener("click", function () {
        delete fotos[stand.fotoId];
        schreib("fotos", fotos);
        stand.fotoId = null;
        zeichnen();
      });

      $("ins-buch").addEventListener("click", function () {
        erledigt.push(schluessel(e));
        schreib("erledigt", erledigt);
        erlebt.push({
          datum: e.datum, titel: e.titel, kategorie: e.kategorie,
          bewertung: stand.bewertung, notiz: stand.notiz.trim(), fotoId: stand.fotoId
        });
        schreib("erlebt", erlebt);
        neueMitteilung({ von: "!", titel: "Steht jetzt im Buch: " + e.titel,
          text: BEWERTUNG[stand.bewertung - 1] + (stand.fotoId ? " · mit Foto" : "") });
        sheetAuf(
          "<h3>Steht im Buch</h3>" +
          "<p>Die drei bekommen es gleich zu sehen.</p>" +
          '<button class="cta quiet" data-zu>Gut</button>'
        );
        zeichneAlles();
        zeichneBuch();
      });
    }

    zeichnen();
  }

  function buchSheet(b) {
    sheetAuf(
      '<div class="bild ' + phKlasse(b) + '"' + phStil(b) + "></div>" +
      '<div class="kicker">' + b.monat + "</div>" +
      "<h3>" + roh(b.titel) + "</h3>" +
      "<p>" + roh(b.reaktionen) + "</p>" +
      '<button class="cta quiet" data-zu>Zurück</button>'
    );
  }

  /* ---------- Buch ---------- */
  function zeichneBuch() {
    $("filters").innerHTML = INHALT.filter.map(function (f, i) {
      return '<button class="fil" aria-pressed="' + (i === 0) + '" data-f="' + f.schluessel + '">' + f.name + "</button>";
    }).join("");

    var seiten = buchSeiten();
    $("stack").innerHTML = seiten.map(function (b, i) {
      return '<button class="entry tap ' + b.farbe + '" data-b="' + i + '" data-art="' + b.art + '">' +
        '<div class="' + phKlasse(b) + '"' + phStil(b) + "></div>" +
        '<div class="cap"><div class="kicker">' + b.monat + "</div><h4>" + roh(b.titel) + "</h4></div>" +
        '<div class="foot">' + roh(b.reaktionen) + "</div></button>";
    }).join("");

    Array.prototype.forEach.call($("stack").children, function (el) {
      el.addEventListener("click", function () { buchSheet(seiten[+el.dataset.b]); });
    });

    var fils = $("filters").children;
    Array.prototype.forEach.call(fils, function (f) {
      f.addEventListener("click", function () {
        Array.prototype.forEach.call(fils, function (x) { x.setAttribute("aria-pressed", "false"); });
        f.setAttribute("aria-pressed", "true");
        Array.prototype.forEach.call($("stack").children, function (e) {
          e.hidden = !(f.dataset.f === "alles" || e.dataset.art === f.dataset.f);
        });
      });
    });
  }

  /* ---------- Familie: der Plan der nächsten Wochen ---------- */
  var WOCHEN_VORAUS = 5;
  var entwurf = null;

  function whatsappText(e) {
    var d = ausIso(e.datum);
    var tag = tagLang(d);
    if (tageDazwischen(new Date(), d) > 7) tag += ", " + d.getDate() + ". " + MON_KURZ[d.getMonth()];
    if (e.textVorlage) return e.textVorlage.replace("{TAG}", tag).replace("{ZEIT}", e.zeit);
    // Bei etwas Selbstgemachtem gibt es nichts anzumelden — da kommt nur jemand.
    return "Opa, " + tag + " um " + e.zeit + " " + e.titel +
      (e.ort ? " · " + e.ort : "") + ". " +
      (e.id === "eig" ? "" : "Ich melde dich an. ") +
      e.abholung.titel + " " + e.abholung.text + ".";
  }

  /* Der Blick von oben. Nur Punkte, keine Titel — die Frage, die dieses
     Raster beantwortet, ist "wo sind die Löcher", und dafür braucht man
     keine Namen. Ein Tipp auf einen Tag öffnet die Woche, in der er liegt. */
  function zeichneRaster(mo, termine) {
    var heute = mitternacht(new Date());
    var zellen = "";
    for (var i = 0; i < WOCHEN_VORAUS * 7; i++) {
      var tag = plusTage(mo, i);
      var drauf = termine.filter(function (x) { return x.datum === iso(tag); });
      var steht = drauf.filter(function (x) { return !istAbgesagt(x); });
      var k = "rz";
      if (+tag === +heute) k += " heute";
      else if (tag < heute) k += " vorbei";
      if (steht.length) k += " hat";
      else if (drauf.length) k += " ab";
      zellen += '<button class="' + k + '" data-w="' + Math.floor(i / 7) + '" ' +
        'aria-label="' + langesDatum(tag) + '">' +
        '<span class="n">' + tag.getDate() + "</span><i></i></button>";
    }
    var bis = plusTage(mo, WOCHEN_VORAUS * 7 - 1);
    var spanne = MONATE[mo.getMonth()] +
      (bis.getMonth() !== mo.getMonth() ? " – " + MONATE[bis.getMonth()] : "");

    $("raster").innerHTML =
      '<p class="monat">' + spanne + "</p>" +
      '<div class="kopf">' + TAGE_KURZ.map(function (t) { return "<span>" + t + "</span>"; }).join("") + "</div>" +
      '<div class="netz">' + zellen + "</div>";

    Array.prototype.forEach.call($("raster").querySelectorAll(".rz"), function (el) {
      el.addEventListener("click", function () { wochenSheet(+el.dataset.w); });
    });
  }

  function zeichneFamilie() {
    var mo = montagDieserWoche(new Date());
    var termine = alleTermine();

    // Jede Absage, die noch bevorsteht. Frueher verschwand die Warnung,
    // sobald in derselben Woche etwas anderes stand — damit ging aber die
    // Nachricht "er hat abgesagt" verloren. Sie bleibt jetzt stehen, bis
    // jemand den Termin neu legt oder herausnimmt. Beides ist ein Tipp.
    var offeneAbsage = termine.filter(function (e) {
      return istAbgesagt(e) && tageDazwischen(new Date(), ausIso(e.datum)) >= 0;
    })[0];

    var banner = "";
    if (offeneAbsage) {
      // Steht in der Woche sonst noch etwas? Davon haengt ab, was zu tun ist.
      var moA = montagDieserWoche(ausIso(offeneAbsage.datum)), soA = plusTage(moA, 6);
      var restWoche = termine.filter(function (x) {
        var d = ausIso(x.datum);
        return d >= moA && d <= soA && !istAbgesagt(x);
      }).length;
      banner += '<div class="banner"><div class="ic">!</div><div><b>Opa hat abgesagt: ' +
        roh(offeneAbsage.titel) + " (" + tagKurz(ausIso(offeneAbsage.datum)) + ")</b><span>„" +
        roh(gruende[schluessel(offeneAbsage)] || "Ohne Angabe") + "“ · " +
        (restWoche ? "In der Woche steht noch etwas anderes."
                   : "Die Woche steht wieder offen.") +
        "</span></div></div>";
    }

    // Termin war, aber es kam nichts zurück. Genau dann ruft man an —
    // sonst erfährt niemand, ob er überhaupt da war.
    var ohneRueck = termine.filter(function (e) {
      var alter = -tageDazwischen(new Date(), ausIso(e.datum));
      return schonVorbei(e) && !istAbgesagt(e) && !istErledigt(e) && alter >= 0 && alter <= 7;
    })[0];
    if (ohneRueck) {
      banner += '<div class="banner" style="background:var(--sunk)">' +
        '<div class="ic" style="background:var(--ink)">?</div><div>' +
        "<b>Keine Rückmeldung: " + roh(ohneRueck.titel) + "</b>" +
        "<span>War am " + tagLang(ausIso(ohneRueck.datum)) +
        ". Ob er da war, weiß bisher niemand.</span></div></div>";
    }
    $("fam-banner").innerHTML = banner;

    zeichneRaster(mo, termine);

    var leereWochen = 0, html = "";
    for (var w = 0; w < WOCHEN_VORAUS; w++) {
      var start = plusTage(mo, w * 7), ende = plusTage(start, 6);
      var drin = termine.filter(function (e) {
        var d = ausIso(e.datum);
        return d >= start && d <= ende && !istAbgesagt(e);
      });
      var offen = drin.length === 0;
      if (offen) leereWochen++;

      var was = offen ? "Noch nichts geplant"
        : drin.map(function (e) { return roh(e.titel) + " (" + tagKurz(ausIso(e.datum)) + ")"; }).join(" · ");
      var name = w === 0 ? "Diese Woche" : w === 1 ? "Nächste Woche" : "In " + w + " Wochen";

      // Offene Fragen aus der Woche. Die stehen hier und nirgends sonst.
      var unterUns = drin.filter(function (e) { return e.intern; })
                         .map(function (e) { return roh(e.intern); }).join(" · ");

      html += '<button class="woche' + (offen ? " offen" : "") + '" data-w="' + w + '">' +
        '<div class="marke">' + start.getDate() + ".<br>" + MON_KURZ[start.getMonth()] + "</div>" +
        '<div class="tx"><b>' + name + "</b><span>" + was + "</span>" +
        (unterUns ? "<em>Unter uns: " + unterUns + "</em>" : "") + "</div>" +
        '<span class="pfeil">' + (offen ? "+" : "›") + "</span></button>";
    }
    $("wochen").innerHTML = html;
    Array.prototype.forEach.call($("wochen").children, function (el) {
      el.addEventListener("click", function () { wochenSheet(+el.dataset.w); });
    });

    $("fam-eyebrow").textContent = leereWochen
      ? leereWochen + (leereWochen === 1 ? " Woche" : " Wochen") + " noch leer"
      : "Die nächsten Wochen stehen";

    if (offeneAbsage) {
      entwurf = { titel: "Antwort auf die Absage",
        text: "Opa, alles gut — " + offeneAbsage.titel + " ist abgesagt. Ich such was anderes für die Woche und sag dir Bescheid." };
    } else if (!entwurf) {
      var naechster = termine.filter(function (e) { return !schonVorbei(e) && !istAbgesagt(e); })[0];
      entwurf = naechster
        ? { titel: "WhatsApp an Opa", text: whatsappText(naechster) }
        : { titel: "WhatsApp an Opa", text: "Opa, ich schau, was nächste Woche geht, und meld mich." };
    }
    $("draft-titel").textContent = entwurf.titel;
    $("draft").textContent = entwurf.text;
    zuruecksetzenKopieren();

    zeichneWerkbank();
  }

  /* Eine Woche füllen. Das ist die Antwort auf "drei Wochen im Voraus".
     Hier drin passiert alles, was die Familie mit einer Woche machen kann:
     eintragen, ändern, herausnehmen. Opa sieht dieses Blatt nie. */
  function wochenSheet(w) {
    var mo = plusTage(montagDieserWoche(new Date()), w * 7);
    var ende = plusTage(mo, 6);
    // Alles, was in der Woche liegt — auch das Abgesagte. Sonst könnte die
    // Familie eine Absage weder umlegen noch herausnehmen, und sie bliebe
    // als grauer Punkt in Opas Streifen stehen, ohne dass jemand rankommt.
    var drin = alleTermine().filter(function (e) {
      var d = ausIso(e.datum);
      return d >= mo && d <= ende;
    });
    var steht = drin.filter(function (e) { return !istAbgesagt(e); });

    var kopf = mo.getDate() + ". " + MON_KURZ[mo.getMonth()] + " – " + ende.getDate() + ". " + MON_KURZ[ende.getMonth()];
    var name = w === 0 ? "Diese Woche" : w === 1 ? "Nächste Woche" : "In " + w + " Wochen";
    var html = '<div class="kicker">' + kopf + "</div><h3>" + name + "</h3>";

    html += drin.length
      ? '<div class="wochen">' + drin.map(function (e, i) {
          var ab = istAbgesagt(e);
          return '<div class="woche' + (ab ? " ab" : "") + '"><div class="marke">' +
            tagKurz(ausIso(e.datum)) + "</div>" +
            '<button class="tx" data-bearb="' + i + '"><b>' + roh(e.titel) + "</b><span>" +
            (ab ? "Abgesagt · " + roh(gruende[schluessel(e)] || "ohne Angabe")
                : roh(e.zeit) + " · " + roh(e.ort)) + "</span>" +
            (e.intern ? "<em>Unter uns: " + roh(e.intern) + "</em>" : "") + "</button>" +
            '<button class="weg" data-weg="' + i + '" aria-label="Wieder herausnehmen">×</button></div>';
        }).join("") + "</div>" +
        '<p style="margin-top:11px">Antippen, um etwas zu ändern.' +
        (steht.length < drin.length ? " Ein abgesagter Termin steht wieder, sobald ihr ihn neu legt." : "") +
        "</p>"
      : "<p>Noch nichts. Trag etwas ein — es steht dann sofort in Opas Woche.</p>";

    // Zuerst das Selbstgemachte. Das ist die Sorte, die in seiner Woche
    // wirklich funktioniert: es braucht keine Anmeldung, nur einen Menschen.
    html += '<div class="abschnitt"><h5>Selbst eintragen</h5>' +
      "<p>Kein Anruf nötig. Nur ihr.</p></div>" +
      '<div class="vorlagen">' + INHALT.eigenesVorlagen.map(function (v, i) {
        return '<button data-vor="' + i + '">' + v.titel + "</button>";
      }).join("") + "</div>" +
      '<button class="cta leise" id="w-frei">Etwas anderes eintragen</button>';

    html += '<div class="abschnitt"><h5>Aus dem Katalog</h5>' +
      "<p>Feste Angebote vor Ort.</p></div>";

    html += INHALT.vorschlaege.map(function (v, i) {
      var tag = plusTage(mo, v.wochentag - 1);
      var vorbei = tageDazwischen(new Date(), tag) < 0;
      var schon = steht.filter(function (e) { return e.id === v.id; }).length > 0;
      var aus = vorbei || schon;
      return '<button class="opt ' + v.farbe + '" data-v="' + i + '"' + (aus ? ' disabled style="opacity:.42"' : "") + ">" +
        '<div class="kicker">' + v.kicker + "</div><h4>" + v.titel + "</h4>" +
        '<p class="sub">' + TAGE_LANG[v.wochentag - 1] + ", " + tag.getDate() + ". " + MON_KURZ[tag.getMonth()] +
        " · " + v.zeit + " · " + v.ort + "</p>" +
        '<span class="note">' + (schon ? "Steht schon" : vorbei ? "Tag ist vorbei" : v.hinweis) + "</span></button>";
    }).join("");

    html += '<button class="cta quiet" data-zu>Zurück</button>';
    sheetAuf(html);

    alle("#sheet [data-bearb]").forEach(function (b) {
      b.addEventListener("click", function () { terminSheet(drin[+b.dataset.bearb], mo, null); });
    });

    alle("#sheet [data-vor]").forEach(function (b) {
      b.addEventListener("click", function () { terminSheet(null, mo, INHALT.eigenesVorlagen[+b.dataset.vor]); });
    });
    $("w-frei").addEventListener("click", function () { terminSheet(null, mo, null); });

    // Wieder herausnehmen. Wichtig: solange Opa es noch nicht gesehen hat,
    // ist das ein stilles Loeschen. Hat er es schon gesehen, muss er es
    // erfahren — dafuer fehlt uns noch der Server.
    alle("#sheet [data-weg]").forEach(function (b) {
      b.addEventListener("click", function () {
        var raus = drin[+b.dataset.weg];
        geloescht.push(schluessel(raus));
        schreib("geloescht", geloescht);
        eigene = eigene.filter(function (x) { return schluessel(x) !== schluessel(raus); });
        schreib("eigene", eigene);
        // Mit dem Termin geht auch seine Absage. Sonst bliebe ein Grund
        // zu einem Termin stehen, den es nicht mehr gibt.
        abgesagt = abgesagt.filter(function (x) { return x !== schluessel(raus); });
        schreib("abgesagt", abgesagt);
        neueMitteilung({ von: "P", titel: "Wieder herausgenommen: " + raus.titel,
          text: tagLang(ausIso(raus.datum)) + " ist wieder frei." });
        sheetZu();
        zeichneAlles();
      });
    });

    alle("#sheet [data-v]").forEach(function (b) {
      if (b.disabled) return;
      b.addEventListener("click", function () {
        var v = INHALT.vorschlaege[+b.dataset.v];
        var tag = plusTage(mo, v.wochentag - 1);
        var neu = {
          uid: kennung(), id: v.id,
          datum: iso(tag), zeit: v.zeit, gewesenAb: v.gewesenAb,
          titel: v.titel, kategorie: v.kategorie, ort: v.ort, zusatz: v.zusatz,
          abholung: v.abholung, danach: v.danach, textVorlage: v.text, intern: ""
        };
        eigene.push(neu);
        schreib("eigene", eigene);
        entwurf = { titel: "WhatsApp an Opa", text: whatsappText(neu) };
        neueMitteilung({ von: "P", titel: "Neu geplant: " + v.titel,
          text: TAGE_LANG[v.wochentag - 1] + ", " + tag.getDate() + ". " + MON_KURZ[tag.getMonth()] + " um " + v.zeit + "." });
        sheetZu();
        zeichneAlles();
      });
    });
  }

  /* ---------- Termin anlegen und ändern -------------------------------
     Das Formular hat zwei Teile, und die Trennung ist der ganze Punkt:
     oben steht, was in Opas Woche landet — unten, was unter uns bleibt.
     Wer beides in ein Feld schreibt, schreibt früher oder später etwas
     in Opas Woche, was da nicht hingehört.
     ------------------------------------------------------------------ */
  var KATEGORIEN = [
    { k: "wasser", n: "Wasser" }, { k: "kaffee", n: "Kaffee" },
    { k: "runde",  n: "Runde"  }, { k: "rad",    n: "Rad"    },
    { k: "erzaehlen", n: "Erzählen" }, { k: "werk", n: "Draußen" }
  ];

  function terminSheet(vorhanden, mo, vorlage) {
    var neu = !vorhanden;
    var v = vorlage || {};
    var s = neu
      ? { uid: kennung(), titel: v.titel || "", kategorie: v.kategorie || "kaffee",
          versatz: null, zeit: v.zeit || "15:00", ort: v.ort || "",
          zusatz: v.zusatz || "", wer: "P", werText: "", intern: "" }
      : { uid: vorhanden.uid || kennung(), titel: vorhanden.titel,
          kategorie: vorhanden.kategorie,
          versatz: tageDazwischen(mo, ausIso(vorhanden.datum)),
          zeit: vorhanden.zeit, ort: vorhanden.ort || "",
          zusatz: vorhanden.zusatz || "",
          wer: vorhanden.abholung ? vorhanden.abholung.kuerzel : "P",
          werText: vorhanden.abholung ? vorhanden.abholung.text : "",
          intern: vorhanden.intern || "" };

    // Beim Anlegen auf den ersten Tag, der noch nicht vorbei ist.
    if (s.versatz === null) {
      s.versatz = 0;
      for (var i = 0; i < 7; i++) {
        if (tageDazwischen(new Date(), plusTage(mo, i)) >= 0) { s.versatz = i; break; }
      }
    }

    var tage = "";
    for (var t = 0; t < 7; t++) {
      var tag = plusTage(mo, t);
      tage += '<button data-tag="' + t + '" aria-pressed="' + (t === s.versatz) + '"' +
        (tageDazwischen(new Date(), tag) < 0 ? " disabled" : "") + ">" +
        TAGE_KURZ[t] + "<br>" + tag.getDate() + "</button>";
    }
    var wer = INHALT.familie.map(function (p) {
      return '<button data-wer="' + p.kuerzel + '" aria-pressed="' + (s.wer === p.kuerzel) + '">' + p.name + "</button>";
    }).join("") + '<button data-wer="-" aria-pressed="' + (s.wer === "-") + '">Selbst</button>';
    var farben = KATEGORIEN.map(function (c) {
      return '<button data-farbe="' + c.k + '" aria-pressed="' + (s.kategorie === c.k) +
        '" style="background:var(--c-' + c.k + ')" aria-label="' + c.n + '"></button>';
    }).join("");

    sheetAuf(
      '<div class="kicker">' + mo.getDate() + ". " + MON_KURZ[mo.getMonth()] + " – " +
        plusTage(mo, 6).getDate() + ". " + MON_KURZ[plusTage(mo, 6).getMonth()] + "</div>" +
      "<h3>" + (neu ? "Etwas eintragen" : "Ändern") + "</h3>" +

      '<div class="abschnitt erst"><h5>Was Opa sieht</h5></div>' +
      '<div class="feld"><label>Was</label><input id="t-titel" value="' + roh(s.titel) +
        '" placeholder="Zum Beispiel: Eis essen mit Oma"></div>' +
      '<div class="feld"><label>Tag</label><div class="wahl" id="t-tag">' + tage + "</div></div>" +
      '<div class="feld"><label>Uhrzeit</label><input type="time" id="t-zeit" value="' + roh(s.zeit) + '"></div>' +
      '<div class="feld"><label>Wo</label><input id="t-ort" value="' + roh(s.ort) +
        '" placeholder="Zum Beispiel: Eisdiele am Markt"></div>' +
      '<div class="feld"><label>Ein Satz dazu</label><textarea id="t-zusatz" rows="2" ' +
        'placeholder="Was ihn erwartet. Ruhig kurz.">' + roh(s.zusatz) + "</textarea></div>" +
      '<div class="feld"><label>Wer holt ihn ab</label><div class="wahl" id="t-wer">' + wer + "</div></div>" +
      '<div class="feld"><label>Und wann</label><input id="t-wertext" value="' + roh(s.werText) +
        '" placeholder="um 14:10 vor der Tür"></div>' +
      '<div class="feld"><label>Farbe im Buch</label><div class="farben" id="t-farbe">' + farben + "</div></div>" +

      '<div class="abschnitt"><h5>Unter uns</h5>' +
        "<p>Sieht nur die Familie. Steht nie in Opas Woche.</p></div>" +
      '<div class="feld"><textarea id="t-intern" rows="2" ' +
        'placeholder="Noch offen? Wer fährt zurück? Wer ruft dort an?">' + roh(s.intern) + "</textarea></div>" +

      '<button class="cta" id="t-ok"' + (s.titel.trim().length < 2 ? " disabled" : "") + ">Speichern</button>" +
      '<button class="cta quiet" data-zu>Abbrechen</button>' +
      (neu ? "" : '<button class="loeschen" id="t-weg">Diesen Termin löschen</button>')
    );

    // Tippen wird direkt gemerkt, ohne das Blatt neu zu zeichnen — sonst
    // springt die Tastatur zu und der Blattanfang wieder nach oben.
    function tippt(id, feld, dann) {
      var el = $(id);
      el.addEventListener("input", function () { s[feld] = el.value; if (dann) dann(); });
    }
    tippt("t-titel", "titel", function () { $("t-ok").disabled = s.titel.trim().length < 2; });
    tippt("t-zeit", "zeit");
    tippt("t-ort", "ort");
    tippt("t-zusatz", "zusatz");
    tippt("t-wertext", "werText");
    tippt("t-intern", "intern");

    function gruppe(id, feld, wert) {
      alle("#" + id + " button").forEach(function (b) {
        b.addEventListener("click", function () {
          if (b.disabled) return;
          s[feld] = wert(b);
          alle("#" + id + " button").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
          b.setAttribute("aria-pressed", "true");
        });
      });
    }
    gruppe("t-tag", "versatz", function (b) { return +b.dataset.tag; });
    gruppe("t-wer", "wer", function (b) { return b.dataset.wer; });
    gruppe("t-farbe", "kategorie", function (b) { return b.dataset.farbe; });

    $("t-ok").addEventListener("click", function () {
      var tag = plusTage(mo, s.versatz);
      var person = INHALT.familie.filter(function (p) { return p.kuerzel === s.wer; })[0];
      var stunde = Math.min(23, (+String(s.zeit).split(":")[0] || 15) + 3);
      var obj = {
        // Ein Angebot aus dem Katalog bleibt ein Angebot, auch wenn man die
        // Uhrzeit ändert — sonst stünde im WhatsApp-Text nicht mehr, dass
        // wir ihn anmelden.
        uid: s.uid, id: (vorhanden && vorhanden.id) || "eig",
        datum: iso(tag), zeit: s.zeit, gewesenAb: stunde,
        titel: s.titel.trim(), kategorie: s.kategorie,
        ort: s.ort.trim() || "bei euch", zusatz: s.zusatz.trim(),
        intern: s.intern.trim(),
        abholung: person
          ? { kuerzel: person.kuerzel, titel: person.satz || (person.name + " holt dich ab"),
              text: s.werText.trim() || "Zeit sagen wir noch" }
          : { kuerzel: "·", titel: "Du gehst selbst hin",
              text: s.werText.trim() || "wie besprochen" },
        danach: { titel: "Warst du. Schön.", text: "" }
      };
      // Ein geänderter Beispieltermin wird dabei zu einem echten Termin.
      if (vorhanden && !vorhanden.uid) {
        geloescht.push(schluessel(vorhanden));
        schreib("geloescht", geloescht);
      }
      eigene = eigene.filter(function (x) { return x.uid !== obj.uid; });
      eigene.push(obj);
      schreib("eigene", eigene);

      // Wer einen abgesagten Termin neu setzt, holt ihn damit zurück. Alles
      // andere wäre unehrlich: der Termin steht dann ja wieder.
      var warAbgesagt = abgesagt.indexOf(obj.uid) >= 0;
      if (warAbgesagt) {
        abgesagt = abgesagt.filter(function (x) { return x !== obj.uid; });
        schreib("abgesagt", abgesagt);
      }

      entwurf = { titel: "WhatsApp an Opa", text: whatsappText(obj) };
      neueMitteilung({ von: person ? person.kuerzel : "P",
        titel: (warAbgesagt ? "Neu gelegt: " : neu ? "Neu geplant: " : "Geändert: ") + obj.titel,
        text: tagLang(tag) + ", " + tag.getDate() + ". " + MON_KURZ[tag.getMonth()] + " um " + obj.zeit + "." });
      sheetZu();
      zeichneAlles();
    });

    var weg = $("t-weg");
    if (weg) weg.addEventListener("click", function () {
      geloescht.push(schluessel(vorhanden));
      schreib("geloescht", geloescht);
      eigene = eigene.filter(function (x) { return schluessel(x) !== schluessel(vorhanden); });
      schreib("eigene", eigene);
      neueMitteilung({ von: "P", titel: "Wieder herausgenommen: " + vorhanden.titel,
        text: tagLang(ausIso(vorhanden.datum)) + " ist wieder frei." });
      sheetZu();
      zeichneAlles();
    });
  }

  /* ---------- Werkbank ---------- */
  function zeichneWerkbank() {
    var zustaende = [
      { k: "",         n: "Echter Stand" },
      { k: "gewesen",  n: "Als wär's gewesen" },
      { k: "abgesagt", n: "Als hätt er abgesagt" },
      { k: "leer",     n: "Als wär nichts geplant" }
    ];
    var angemeldet = !!(auth && KONTO);
    $("werkbank").innerHTML = zustaende.map(function (z) {
      return '<button class="wb" data-z="' + z.k + '" aria-pressed="' + (werkbank === z.k) + '">' + z.n + "</button>";
    }).join("") +
      (angemeldet
        ? '<button class="wb" data-ab="1">Abmelden</button>'
        : '<button class="wb" data-rolle="1">Als Opas Gerät ansehen</button>') +
      '<button class="wb" data-reset="1">Alles zurücksetzen</button>' +
      '<p style="margin:9px 0 0;font-size:11.5px;color:var(--faint);font-weight:500;line-height:1.4">' +
      (angemeldet
        ? "Angemeldet als <b>" + roh(KONTO.email) + "</b> · Rolle <b>" + roh(ROLLE || "—") + "</b>."
        : "Kein Server. Dieses Gerät ist gerade: <b>" + (ROLLE === "user" ? "Opas Gerät" : "Familie") +
          "</b> — umschalten mit <b>?rolle=user</b> bzw. <b>?rolle=admin</b> in der Adresse.") + "</p>";

    Array.prototype.forEach.call($("werkbank").querySelectorAll("button"), function (b) {
      b.addEventListener("click", function () {
        if (b.dataset.ab) { abmelden(); return; }
        if (b.dataset.rolle) {
          try { localStorage.setItem("ow.rolle", "user"); } catch (e) {}
          location.search = "?rolle=user";
          return;
        }
        if (b.dataset.reset) {
          try {
            ["gelesen","abgesagt","gruende","erledigt","eigene","geloescht","extraMit","erlebt","fotos"]
              .forEach(function (k) { localStorage.removeItem("ow." + k); });
          } catch (e) {}
          gelesen = []; abgesagt = []; gruende = {}; erledigt = [];
          eigene = []; geloescht = []; extraMit = []; erlebt = []; fotos = {};
          werkbank = ""; entwurf = null;
          zeichneAlles();
          return;
        }
        werkbank = b.dataset.z;
        zeichneAlles();
      });
    });
  }

  /* ---------- Kopieren ---------- */
  var kopierUhr = null;

  function zuruecksetzenKopieren() {
    clearTimeout(kopierUhr);
    var b = $("kopieren");
    b.textContent = "Text kopieren";
    b.classList.remove("fertig");
  }

  function inZwischenablage(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (ok, nein) {
      var t = document.createElement("textarea");
      t.value = text;
      t.setAttribute("readonly", "");
      t.style.cssText = "position:absolute;left:-9999px";
      document.body.appendChild(t);
      t.select();
      t.setSelectionRange(0, text.length);
      var g = false;
      try { g = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(t);
      g ? ok() : nein();
    });
  }

  $("kopieren").addEventListener("click", function () {
    var b = this;
    inZwischenablage($("draft").textContent).then(function () {
      b.textContent = "Kopiert ✓";
      b.classList.add("fertig");
      clearTimeout(kopierUhr);
      kopierUhr = setTimeout(zuruecksetzenKopieren, 2500);
    }).catch(function () {
      b.textContent = "Ging nicht — Text antippen und halten";
      clearTimeout(kopierUhr);
      kopierUhr = setTimeout(zuruecksetzenKopieren, 3500);
    });
  });

  /* ---------- Reiter ---------- */
  var tabs = document.querySelectorAll(".tab");
  Array.prototype.forEach.call(tabs, function (t) {
    t.addEventListener("click", function () {
      Array.prototype.forEach.call(tabs, function (o) {
        o.setAttribute("aria-selected", "false");
        $(o.dataset.p).hidden = true;
        $(o.dataset.p).classList.remove("zeigen");
      });
      t.setAttribute("aria-selected", "true");
      // Wer den Reiter wechselt, kommt auf heute zurück.
      if (blick) { blick = null; zeichneWoche(); }
      var pane = $(t.dataset.p);
      pane.hidden = false;
      void pane.offsetWidth;                 // Animation neu auslösen
      pane.classList.add("zeigen");
      pane.querySelector(".scroll").scrollTop = 0;
      sheetZu();
    });
  });

  $("hero").addEventListener("click", function () {
    if (imFokus) ereignisSheet(imFokus);
  });

  alle("[data-glocke]").forEach(function (b) {
    b.addEventListener("click", mitteilungenSheet);
  });

  /* ---------- Los ---------- */
  function zeichneAlles() {
    zeichneWoche();
    zeichneBuch();
    zeichneFamilie();
    zeichneGlocken();
  }

  // Opas Gerät kennt Familie nicht. Zwei Reiter statt drei — für ihn
  // ist das nicht weniger, sondern weniger im Weg.
  function rolleAnwenden() {
    var opa = ROLLE === "user";
    var famTab = document.querySelector('.tab[data-p="p-fam"]');
    if (famTab) { famTab.hidden = opa; famTab.setAttribute("aria-selected", "false"); }
    if (opa) {
      $("p-fam").hidden = true;
      $("p-book").hidden = true;
      document.querySelector('.tab[data-p="p-book"]').setAttribute("aria-selected", "false");
      document.querySelector('.tab[data-p="p-week"]').setAttribute("aria-selected", "true");
      $("p-week").hidden = false;
    }
  }

  // Ab hier läuft die App wirklich los — erst, wenn feststeht, wer da ist.
  function starten() {
    rolleAnwenden();
    gesichter();
    zeichneBuch();
    zeichneAlles();
  }

  if (firebaseDa()) {
    firebaseStart();
  } else {
    ROLLE = entwicklerRolle();
    starten();
  }

  // Wenn die App im Hintergrund lag und wieder geöffnet wird: Datum nachziehen.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden || !ROLLE) return;
    blick = null;              // Wieder aufgemacht heisst: wieder bei heute.
    zeichneAlles();
  });
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
