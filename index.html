<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Jede Woche ein Ereignis. Fuer Opa.">

<!-- Als App auf den Home-Bildschirm -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Opas Woche">

<title>Opas Woche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Durchgehend hell. Weisser Grund, die Karten tragen die Farbe.
   Alle Farben explizit — die Seite haelt auf jedem Untergrund. */
:root{
  --page:#FFFFFF;
  --sunk:#F4F2EF;
  --ink:#14181C;
  --dim:#6B757C;
  --faint:#A4ADB2;
  --line:rgba(20,24,28,.09);
  --accent:#C8521A;
  --good:#146B4C;

  --c-wasser:#C3DCE7;
  --c-kaffee:#F7CCA3;
  --c-runde:#E2CDE8;
  --c-rad:#CBDFBB;
  --c-erzaehlen:#F5DE9C;
  --c-werk:#DFD3C7;

  --font:Figtree,ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --leiste:78px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  margin:0;background:var(--page);color:var(--ink);font-family:var(--font);
  line-height:1.35;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}

/* Nur der Inhalt scrollt. Die Leiste unten steht fest. */
.app{
  width:100%;max-width:430px;height:100%;background:var(--page);
  position:relative;display:flex;flex-direction:column;overflow:hidden;
}
@media (min-width:540px){
  html,body{overflow:auto}
  body{background:#E9E5DE;align-items:center;padding:24px 0;height:auto;min-height:100%}
  .app{height:880px;max-height:calc(100vh - 48px);border-radius:44px;
       box-shadow:0 30px 70px -28px rgba(20,24,28,.42)}
}
.pane{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding:0 20px calc(var(--leiste) + 18px);
}

/* Sanfter Wechsel zwischen den Reitern */
@keyframes rein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pane.zeigen{animation:rein .3s cubic-bezier(.32,.72,0,1)}

/* Alles Antippbare gibt nach */
.tap{transition:transform .12s ease}
.tap:active{transform:scale(.975)}

/* ---------- Kopfzeile ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:18px 0 2px}
.topbar .mid{flex:1;min-width:0;text-align:center}
.topbar .mid b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.02em}
.topbar .mid span{display:block;font-size:13px;color:var(--dim);font-weight:500;margin-top:1px}
.topbar .spread{flex:1}

.face{
  width:42px;height:42px;border-radius:21px;flex:0 0 auto;display:grid;place-items:center;
  font-size:14px;font-weight:700;color:#fff;overflow:hidden;position:relative;
}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.face::after{content:"";position:absolute;inset:0;background:radial-gradient(66% 58% at 30% 24%,rgba(255,255,255,.45),transparent 62%)}
.face.foto::after{display:none}
.f-opa{background:linear-gradient(150deg,#3E6E7E,#8FB6BF)}
.f-a{background:linear-gradient(150deg,#8A5330,#C79A6A)}
.f-b{background:linear-gradient(150deg,#4C5E38,#9AB07C)}
.f-c{background:linear-gradient(150deg,#4A4468,#9B92BC)}
.faces{display:flex;flex:0 0 auto}
.faces .face{width:38px;height:38px;border-radius:19px;box-shadow:0 0 0 3px var(--page);margin-right:-12px}
.faces .face:last-child{margin-right:0}

.bell{
  width:42px;height:42px;border-radius:21px;flex:0 0 auto;position:relative;
  border:1.5px solid var(--line);display:grid;place-items:center;
  transition:transform .12s ease;
}
.bell:active{transform:scale(.92)}
.bell svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bell i{
  position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:5px;
  background:var(--accent);box-shadow:0 0 0 2.5px var(--page);
}

/* ---------- Grosser Titel ---------- */
.title{padding:30px 0 2px}
.title .eyebrow{margin:0 0 5px;font-size:14px;font-weight:600;color:var(--dim)}
.title h1{margin:0;font-size:36px;font-weight:800;letter-spacing:-.04em;line-height:1}

/* ---------- Hero: Motiv schaut oben aus der Karte heraus ---------- */
.hero{position:relative;margin-top:28px;display:block;width:100%}
.hero .inner{border-radius:28px;overflow:hidden;background:var(--c-wasser)}
.hero .art{
  position:absolute;top:-36px;right:-4px;width:134px;height:134px;z-index:2;pointer-events:none;
  filter:drop-shadow(0 14px 18px rgba(20,24,28,.22));
}
.hero .art svg{width:100%;height:100%;display:block}
.hero .top{padding:20px 20px 18px}
.hero .txt{max-width:64%}
.chip{
  display:inline-block;background:rgba(255,255,255,.78);color:var(--ink);
  font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:20px;margin-bottom:11px;
}
/* Zwei Zeilen sind fuer den Titel immer reserviert, auch wenn er nur eine
   braucht. Sonst ist die Karte bei "Broetchen holen" 27 Pixel flacher als
   bei "Warmbadetag im Hallenbad", und der ganze Wochenstreifen darunter
   rutscht beim Umschalten mit. Fuer jemanden, der die Tage mit dem Finger
   sucht, ist eine Leiste, die sich bewegt, schlimmer als ein bisschen Luft
   im Farbfeld. Als em, damit es mitwaechst, wenn iOS die Schrift vergroessert. */
.hero h2{margin:0;font-size:25px;font-weight:800;letter-spacing:-.038em;line-height:1.08;
  min-height:2.16em;text-wrap:balance}
.hero .meta{margin:9px 0 0;font-size:14.5px;font-weight:500;color:rgba(20,24,28,.68)}
.band{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.55);padding:12px 20px}
.band .ic{
  width:34px;height:34px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--ink);color:#fff;font-size:14px;font-weight:700;
}
.band.fertig .ic{background:var(--good)}
.band b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.018em}
.band span{display:block;font-size:13.5px;color:var(--dim);font-weight:500;margin-top:1px}
/* Auf der Karte steht genau EIN Band: wer ihn abholt.
   Der Rueckweg stand hier kurz als zweites Band darunter und ist wieder
   raus. Die Karte ist der Blick von der Tuer aus — sie soll das Gefuehl
   geben "es ist geplant, jemand kommt", nicht die Fahrgemeinschaft
   durchdeklinieren. Zwei Baender waren zwei Ansagen, wo eine reicht.
   Alles Weitere steht im Blatt, das ein Tipp auf die Karte oeffnet: dort
   erwartet man Einzelheiten, weil man danach gefragt hat. */

/* Ruhiger Grund, wenn nichts ansteht oder abgesagt wurde */
.hero.stumm .inner{background:var(--sunk)}

/* ---------- Wochenstreifen ---------- */
.week{display:flex;gap:6px;margin-top:16px}
.wd{
  flex:1;border:1.5px solid var(--line);border-radius:18px;background:var(--page);
  padding:9px 0 9px;display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:transform .12s ease;
}
.wd:active{transform:scale(.94)}
.wd .dot{height:5px;display:block}
.wd .dot i{width:5px;height:5px;border-radius:3px;background:transparent;display:block}
.wd b{font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:.02em}
.wd .num{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.025em}
/* heute = gefuellt. Gefuellt heisst immer "jetzt". */
.wd.today{background:var(--ink);border-color:var(--ink)}
.wd.today b{color:rgba(255,255,255,.6)}
.wd.today .num{color:#fff;font-weight:800}
/* Termin = Rahmen und Punkt. Rahmen heisst "kommt noch".
   Das Orange gilt ausdruecklich nur, solange der Tag nicht heute ist.
   Auf dem dunklen Heute-Kasten sagt schon die Fuellung "jetzt" und der
   Punkt "da ist was" — eine dritte Farbe macht daraus ein Durcheinander
   aus Schwarz, Weiss und Orange. Deshalb :not(.today) und nicht eine
   Ueberschreibung weiter unten: die Regel steht damit dort, wo sie gilt. */
.wd.event{border-color:var(--accent);border-width:2px}
.wd.event:not(.today) b,.wd.event:not(.today) .num{color:var(--accent);font-weight:800}
.wd.event .dot i{background:var(--accent)}
.wd.today.event{background:var(--ink);border-color:var(--ink)}
.wd.today.event b{color:rgba(255,255,255,.6)}
.wd.today.event .num{color:#fff}
/* Punkt nur, wenn an dem Tag wirklich etwas ist */
.wd.today.event .dot i{background:#fff;width:6px;height:6px;border-radius:3px}
/* Abgesagt = ein grauer Punkt, mehr nicht. Der Kasten steht da wie jeder
   andere Tag, mit Wochentag UND Datum.

   Die Klasse heisst .ab und nicht mehr .weg — und das ist kein Geschmack:
   .weg ist weiter unten der Herausnehmen-Knopf im Tagesblatt (34x34,
   display:grid). Beide Regeln trafen sich auf demselben Element, die
   spaetere gewann, und der Tag wurde zu einem 34-Pixel-Kaestchen
   zusammengefaltet. Das Datum stand dann weiss unter dem Kasten im
   Nichts. Genau so sah es aus. */
.wd.ab .dot i{background:var(--faint)}
.wd.today.ab .dot i{background:rgba(255,255,255,.5)}

/* Der Tag, den die grosse Karte gerade zeigt.
   Keine eigene Farbe — in einer Reihe aus sieben Kaesten waeren drei
   Farbbedeutungen zu viel. Stattdessen waechst die Zahl. Die Zeile
   darunter ist auf feste Hoehe gestellt, damit dabei nichts springt. */
.wd .num{line-height:23px;height:23px;transition:font-size .16s ease}
.wd.blick{transform:scale(1.06)}
.wd.blick:active{transform:scale(1.01)}
.wd.blick .num{font-size:23px;font-weight:800}
.wd.blick b{color:var(--ink)}
.wd.today.blick b{color:rgba(255,255,255,.75)}
.wd.event.blick:not(.today) b{color:var(--accent)}

/* Der Weg zurueck zu dem, was als Naechstes ansteht.
   Frueher war das der Heute-Kasten im Streifen: er steht immer vorne und
   fuehrte immer zum Standard. Das traegt nicht mehr, seit ein Tipp auf
   einen leeren Tag ein Blatt oeffnet statt die Karte zu wechseln — dann
   tut derselbe Kasten an einem leeren Montag etwas voellig anderes.

   Er sass kurz als eigene Zeile unter dem Streifen. Das war falsch: sobald
   man sich einen spaeteren Termin ansah, kam die Zeile dazu und schob alles
   darunter nach unten. Ein Streifen, unter dem sich beim Antippen die halbe
   Seite verschiebt, ist genau das, was hier nicht passieren darf.
   Jetzt steht er IN der Aktionsreihe, links neben dem Knopf: nur der wird
   schmaler, nichts wandert.

   Und er traegt keinen Text mehr. "Zurueck zum Naechsten" widerspricht sich,
   wenn man es aus dem Zusammenhang reisst — zurueck und nach vorn in einem
   Satz. Ein Pfeil sagt dasselbe und behauptet keine Richtung in der Zeit. */
/* Aktionsreihe: der Pfeil zurueck und der Knopf nebeneinander.
   Heisst mit Absicht nicht .reihe — die Werkbank hat schon eine. Zwei
   gleichnamige Klassen auf verschiedenen Elementen haben uns den
   abgesagten Tag zerlegt, das reicht einmal. */
.aktionsreihe{display:flex;gap:10px;margin-top:14px}
.aktionsreihe .cta{flex:1;min-width:0;margin-top:0}
.zurueck{
  flex:0 0 auto;width:54px;height:54px;border-radius:18px;
  background:var(--sunk);color:var(--ink);
  display:grid;place-items:center;line-height:1;
  font-size:27px;font-weight:600;padding-bottom:4px;
  transition:transform .12s ease;
}
.zurueck:active{transform:scale(.96)}

/* ---------- Knoepfe ---------- */
.cta{
  display:block;width:100%;height:54px;border-radius:18px;background:var(--accent);color:#fff;
  font-size:17.5px;font-weight:700;letter-spacing:-.02em;text-align:center;margin-top:14px;
  transition:transform .12s ease,background-color .2s ease;
}
.cta.quiet{background:var(--sunk);color:var(--dim);font-weight:600;font-size:16.5px}
/* Leise, aber sichtbar antippbar: heller Grund, schwarze Schrift.
   Ein unsichtbarer Absageknopf fuehrt nur dazu, dass er still nicht hingeht. */
.cta.leise{background:var(--sunk);color:var(--ink);font-weight:700;font-size:17px}
.cta.fertig{background:var(--good)}
.cta[disabled]{opacity:.38}
.cta:active{transform:scale(.985)}

/* Begruendung beim Absagen */
.grund{
  width:100%;margin-top:13px;border:1.5px solid var(--line);border-radius:16px;
  padding:13px 15px;font-family:inherit;font-size:16.5px;font-weight:500;
  color:var(--ink);background:var(--page);resize:none;line-height:1.4;
}
.grund:focus{outline:none;border-color:var(--accent)}
.klein{
  display:block;width:100%;text-align:center;margin-top:14px;
  font-size:14px;font-weight:600;color:var(--dim);text-decoration:underline;
}
.weg{
  width:34px;height:34px;border-radius:12px;flex:0 0 auto;background:var(--page);
  border:1.5px solid var(--line);color:var(--dim);font-size:20px;
  display:grid;place-items:center;line-height:1;
}

/* Regler fuer "Wie war's" — der Griff ist absichtlich riesig.
   Man kann ihn ziehen, aber auch einfach auf die Leiste tippen. */
.regler{margin-top:18px}
.regler input{width:100%;height:40px;-webkit-appearance:none;appearance:none;background:transparent}
.regler input:focus{outline:none}
.regler input::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:var(--sunk)}
.regler input::-webkit-slider-thumb{
  -webkit-appearance:none;width:40px;height:40px;border-radius:20px;
  background:var(--accent);margin-top:-14px;box-shadow:0 4px 12px rgba(20,24,28,.32);
}
.regler input::-moz-range-track{height:12px;border-radius:6px;background:var(--sunk)}
.regler input::-moz-range-thumb{width:40px;height:40px;border:0;border-radius:20px;background:var(--accent)}
.regler b{display:block;text-align:center;margin-top:4px;font-size:20px;font-weight:800;letter-spacing:-.03em}

/* Echtes Foto statt Platzhalterverlauf */
.ph.echt{background-size:cover;background-position:center}
.ph.echt::after{display:none}
.sterne{color:var(--accent);letter-spacing:.06em}

/* ---------- Abschnitt + Rail ---------- */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 12px}
.sec h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.035em}
.sec span{font-size:14px;font-weight:650;color:var(--accent)}
.rail{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:0 20px;margin:0 -20px}
.rail::-webkit-scrollbar{display:none}
.tile{flex:0 0 108px;display:block;text-align:left}
.tile .ph{height:108px;border-radius:20px}
.tile b{display:block;margin-top:8px;font-size:13px;font-weight:650;letter-spacing:-.015em}
.tile small{display:block;color:var(--faint);font-size:12px;font-weight:500;margin-top:1px}

/* Platzhalter fuer echte Fotos */
.ph{position:relative;overflow:hidden}
.ph::after{content:"";position:absolute;inset:0;
  background:radial-gradient(68% 58% at 26% 22%,rgba(255,255,255,.45),transparent 62%)}
.ph-1{background:linear-gradient(155deg,#2C6F86,#83B9C6)}
.ph-2{background:linear-gradient(155deg,#3C6136,#9FBD7C)}
.ph-3{background:linear-gradient(155deg,#94512A,#DBA76C)}
.ph-4{background:linear-gradient(155deg,#4A3C68,#A493C2)}
.ph-5{background:linear-gradient(155deg,#6B6229,#C6B76A)}
.ph-6{background:linear-gradient(155deg,#26555F,#7FACB6)}

/* ---------- Filterreihe ---------- */
.filters{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding:22px 20px 4px;margin:0 -20px}
.filters::-webkit-scrollbar{display:none}
.fil{
  flex:0 0 auto;border:1.5px solid var(--line);border-radius:22px;padding:10px 18px;
  font-size:14.5px;font-weight:650;color:var(--dim);background:var(--page);white-space:nowrap;
  transition:transform .12s ease;
}
.fil:active{transform:scale(.95)}
.fil[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}

/* ---------- Buch: grosse Karten, Foto schaut rechts heraus ---------- */
.stack{display:flex;flex-direction:column;gap:16px;margin-top:20px}
.entry{
  position:relative;border-radius:28px;overflow:hidden;background:var(--sunk);width:100%;
  min-height:140px;padding:21px 23px;display:flex;flex-direction:column;justify-content:space-between;
}
.entry .ph{position:absolute;right:-26px;top:50%;transform:translateY(-50%);
  width:126px;height:126px;border-radius:30px;box-shadow:0 12px 22px -12px rgba(20,24,28,.45)}
.entry .cap{position:relative;z-index:1;max-width:60%}
.kicker{font-size:12px;font-weight:700;color:rgba(20,24,28,.5);letter-spacing:.06em;text-transform:uppercase}
.entry h4{margin:7px 0 0;font-size:21px;font-weight:800;letter-spacing:-.038em;line-height:1.08;text-wrap:balance}
.entry .foot{position:relative;z-index:1;margin-top:14px;font-size:13.5px;font-weight:650;color:rgba(20,24,28,.58)}
.e-wasser{background:var(--c-wasser)}
.e-kaffee{background:var(--c-kaffee)}
.e-runde{background:var(--c-runde)}
.e-rad{background:var(--c-rad)}
.e-erz{background:var(--c-erzaehlen)}
.e-werk{background:var(--c-werk)}
.hint{text-align:center;font-size:13px;color:var(--faint);font-weight:500;margin:18px 0 0}

/* ---------- Familie: Plan der naechsten Wochen ---------- */
.banner{
  display:flex;gap:12px;align-items:flex-start;margin-top:20px;
  background:#FBE3D6;border-radius:22px;padding:15px 17px;
}
.banner .ic{width:30px;height:30px;border-radius:11px;flex:0 0 auto;background:var(--accent);
            color:#fff;display:grid;place-items:center;font-size:15px;font-weight:700}
.banner .tx{flex:1;min-width:0}
.banner b{display:block;font-size:15px;font-weight:750;letter-spacing:-.02em}
.banner span{display:block;font-size:13.5px;color:rgba(20,24,28,.66);font-weight:500;margin-top:2px}
/* Jeder Hinweis traegt ein X. Was nicht weggeht, liest nach dem dritten Mal
   niemand mehr — und dann geht auch der naechste unter, der wirklich zaehlt.
   Weggeklickt wird der Hinweis, nicht die Sache: aendert sich der Anlass,
   kommt er unter neuem Schluessel wieder. */
.banner .zu{
  flex:0 0 auto;width:30px;height:30px;border-radius:15px;margin:-3px -5px 0 0;
  display:grid;place-items:center;line-height:1;
  font-size:19px;color:rgba(20,24,28,.45);
}
.banner.still{background:var(--sunk)}
.banner.still .ic{background:var(--ink)}
.banner.tippbar{transition:transform .12s ease}
.banner.tippbar:active{transform:scale(.99)}

/* Monatsraster — der Blick von oben. Ein Kalendermonat, zum Blaettern,
   vom Montag vor dem Ersten bis zum Sonntag nach dem Letzten.
   Ein Zeichen auf dem Tag sagt, dass da etwas ist — die Zahl bleibt daneben
   lesbar, weil man beim Planen das Datum braucht. Dunkel gefüllt heisst
   weiterhin genau eines: heute. */
.raster{margin-top:20px}
.raster .monatszeile{display:flex;align-items:center;gap:7px;margin:0 0 10px}
.raster .monat{margin:0;flex:1;min-width:0;font-size:12px;font-weight:700;color:var(--faint);
  letter-spacing:.07em;text-transform:uppercase}
.mpfeil{width:32px;height:32px;border-radius:16px;background:var(--sunk);flex:0 0 auto;
  display:grid;place-items:center;font-size:19px;font-weight:700;color:var(--ink);
  line-height:1;transition:transform .12s ease}
.mpfeil:active{transform:scale(.9)}
/* Nur da, wenn man nicht im laufenden Monat steht. Ein Weg zurueck muss
   sichtbar sein, sonst blaettert man sich weg und sucht "jetzt". */
.zuheute{border-radius:15px;background:var(--ink);color:#fff;flex:0 0 auto;
  font-size:12px;font-weight:700;padding:8px 12px;line-height:1}
.raster .kopf{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.raster .kopf span{text-align:center;font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.03em}
.raster .netz{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.rz{height:50px;border-radius:14px;background:var(--sunk);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;transition:transform .12s ease;position:relative}
.rz:active{transform:scale(.9)}
.rz .n{font-size:12.5px;font-weight:650;color:var(--dim);font-variant-numeric:tabular-nums;line-height:1}
.rz .em{font-size:19px;line-height:1;display:block}
/* Steht etwas an, rückt die Zahl unter das Zeichen und wird kleiner.
   Die Fläche trägt dann die Kategoriefarbe — gesetzt wird sie im Skript,
   damit "heute" dunkel bleiben darf. */
.rz.hat .n{font-size:10.5px;font-weight:750;color:rgba(20,24,28,.6)}
/* Mehr als eine Sache an dem Tag. Klein, sonst wird das Raster unruhig. */
.rz .mehr{position:absolute;top:6px;right:7px;width:5px;height:5px;border-radius:3px;background:var(--ink)}
/* Tage aus dem Nachbarmonat. Sie bleiben stehen und antippbar, weil eine
   Woche zusammengehoert — aber sie treten zurueck. Steht dort etwas, holt
   die Kategoriefarbe sie wieder nach vorn; die wird im Skript gesetzt. */
.rz.fremd{background:transparent}
.rz.fremd .n{color:var(--faint)}
/* Abgesagt: das Zeichen bleibt stehen, aber ohne Farbe. Man sieht, was da war,
   und es sieht nicht aus wie etwas, das noch gilt. */
.rz.ab .em{filter:grayscale(1);opacity:.45}
.rz.ab .mehr{background:var(--faint)}
.rz.vorbei{opacity:.42}
.rz.heute{background:var(--ink)}
.rz.heute .n{color:#fff;font-weight:800}
.rz.heute.hat .n{color:rgba(255,255,255,.72)}
.rz.heute .mehr{background:#fff}

/* ---------- Tagesblatt ----------------------------------------------
   Der Streifen zeigt den angetippten Tag und drei Tage links und rechts.
   Er endet mit Absicht nicht am Sonntag: man legt eine Sache auch mal über
   die Wochengrenze, und dann soll das Ziel sichtbar sein.
   -------------------------------------------------------------------- */
/* Was an dem Tag ohnehin laeuft — Radgruppe, Orga-Tag. Keine Warnung,
   eine Auskunft: man soll nicht dagegen planen, ohne es zu merken. */
.routine{display:flex;gap:8px;align-items:baseline;margin:12px 0 0;
  background:var(--sunk);border-radius:14px;padding:10px 13px}
.routine b{flex:0 0 auto;font-size:12.5px;font-weight:750;letter-spacing:-.01em}
.routine span{font-size:12.5px;color:var(--dim);font-weight:500}

.streifen{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:15px 0 2px}
.st{height:58px;border-radius:15px;background:var(--sunk);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;transition:transform .12s ease,background-color .18s ease}
.st .wt{font-size:9.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;text-transform:uppercase;line-height:1}
.st .n{font-size:15.5px;font-weight:750;color:var(--dim);font-variant-numeric:tabular-nums;line-height:1}
.st .em{font-size:12px;line-height:1;height:13px}
.st[aria-pressed="true"]{background:var(--ink)}
.st[aria-pressed="true"] .wt{color:rgba(255,255,255,.55)}
.st[aria-pressed="true"] .n{color:#fff}
.st.vorbei{opacity:.4}
/* Während etwas gezogen wird: alle Tage, auf die man es legen darf. */
.st.ziel{background:#FDEDE4;box-shadow:inset 0 0 0 2px var(--accent)}
.st.ziel .n{color:var(--accent)}
.st.drueber{background:var(--accent)}
.st.drueber .n,.st.drueber .wt{color:#fff}

/* Was an dem Tag schon steht. Gedrückt halten schiebt es auf einen anderen Tag. */
.geplant{display:flex;align-items:center;gap:11px;width:100%;background:var(--sunk);
  border-radius:18px;padding:11px 13px;margin-top:8px;touch-action:pan-y;
  transition:transform .14s ease,box-shadow .14s ease,background-color .18s ease}
.geplant .em{font-size:22px;line-height:1;flex:0 0 auto}
.geplant .tx{flex:1;min-width:0;text-align:left}
.geplant b{display:block;font-size:15px;font-weight:750;letter-spacing:-.02em}
.geplant span{display:block;font-size:12.5px;color:var(--dim);font-weight:500;margin-top:1px}
.geplant .weg{flex:0 0 auto;width:30px;height:30px;border-radius:15px;display:grid;
  place-items:center;color:var(--faint);font-size:17px;background:var(--page)}
.geplant.hebt{transform:scale(1.035);background:var(--page);
  box-shadow:0 16px 34px -12px rgba(20,24,28,.45);position:relative;z-index:2}
/* Hingebracht, aber nicht abgeholt: der Termin ist nicht fertig geplant.
   Das steht in der Farbe da, in der bei uns alles Offene steht. */
.geplant .offen{font-style:normal;color:var(--accent);font-weight:700}
.geplant.ab{opacity:.5}
.geplant.ab b{text-decoration:line-through}
.zieh-hinweis{margin:9px 0 0!important;font-size:12.5px!important;color:var(--faint);font-weight:600}

/* Die drei Vorschläge. Ein festes Angebot trägt eine graue Zeile, weil dort
   jemand anruft — das ist ein Hinweis für uns, kein Rang. In Opas Woche steht
   davon nichts: dort sehen beide Sorten gleich aus und sind gleich viel wert. */
.vor{display:flex;align-items:flex-start;gap:12px;width:100%;border-radius:20px;
  padding:14px 15px;margin-top:9px;border:1.5px solid var(--line);background:var(--page);
  transition:transform .12s ease}
.vor:active{transform:scale(.982)}
.vor .em{font-size:24px;line-height:1.05;flex:0 0 auto}
.vor .tx{flex:1;min-width:0}
.vor b{display:block;font-size:16px;font-weight:750;letter-spacing:-.025em}
.vor span{display:block;font-size:13px;color:var(--dim);font-weight:500;margin-top:2px}
.vor em{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--faint);
  letter-spacing:.05em;text-transform:uppercase;margin-top:7px}
.vor .plus{flex:0 0 auto;color:var(--faint);font-size:21px;font-weight:500;line-height:1}
.vor.fest{background:var(--sunk);border-color:transparent}

/* Archiv: was schon einmal dastand, und der ganze Vorrat.
   Bewusst schmaler als ein Vorschlag — es ist ein Nachschlagewerk, kein
   Angebot. Die drei Vorschlaege oben bleiben die Hauptsache. */
.archivliste{margin-top:10px}
.arch{display:flex;align-items:center;gap:11px;width:100%;background:var(--sunk);
  border-radius:16px;padding:10px 13px;margin-top:7px;transition:transform .12s ease}
.arch:active{transform:scale(.985)}
.arch .em{font-size:19px;line-height:1;flex:0 0 auto}
.arch .tx{flex:1;min-width:0;text-align:left}
.arch b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.02em}
.arch span{display:block;font-size:12px;color:var(--faint);font-weight:600;margin-top:1px}
/* Der kleine Knopf neben "Etwas anderes eintragen" */
.cta.archiv{flex:0 0 auto;width:auto;padding:0 20px;font-size:16px}

/* ---------- Formular: Termin anlegen und ändern ---------- */
.feld{margin-top:14px}
.feld label{display:block;margin-bottom:6px;font-size:11.5px;font-weight:700;
  color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.feld input,.feld textarea{
  width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;
  font-family:inherit;font-size:16px;font-weight:600;color:var(--ink);
  background:var(--page);line-height:1.35;-webkit-appearance:none;
}
.feld textarea{font-weight:500;resize:none}
.feld input:focus,.feld textarea:focus{outline:none;border-color:var(--accent)}
.zeile{display:flex;gap:8px}
.zeile .emj{width:62px;flex:0 0 auto;text-align:center;font-size:21px;padding:12px 4px}
.wahl{display:flex;gap:6px}
.wahl button{
  flex:1;min-width:0;border:1.5px solid var(--line);border-radius:13px;padding:9px 2px;
  text-align:center;font-size:13px;font-weight:700;color:var(--dim);background:var(--page);
  line-height:1.32;font-variant-numeric:tabular-nums;
}
.wahl button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.wahl button[disabled]{opacity:.3}
/* Beim Rueckweg sind es fuenf Moeglichkeiten. Die Reihe darf umbrechen —
   drei Menschen oben, die beiden anderen Faelle darunter. */
.wahl.breit{flex-wrap:wrap;row-gap:6px}
.wahl.breit button{flex:1 0 28%}
.farben{display:flex;gap:8px}
.farben button{flex:1;height:38px;border-radius:13px;border:3px solid transparent}
.farben button[aria-pressed="true"]{border-color:var(--ink)}
.abschnitt{margin-top:24px;padding-top:18px;border-top:1.5px solid var(--line)}
.abschnitt.erst{margin-top:18px;padding-top:0;border-top:0}
.abschnitt h5{margin:0;font-size:11.5px;font-weight:700;color:var(--faint);
  letter-spacing:.07em;text-transform:uppercase}
.abschnitt p{margin:4px 0 0!important;font-size:13px!important;color:var(--faint);font-weight:500}
.loeschen{display:block;width:100%;text-align:center;margin-top:16px;
  font-size:14.5px;font-weight:700;color:var(--accent)}
/* Vorlagen: ein Tipp füllt das Formular vor */
.vorlagen{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.vorlagen button{
  border:1.5px solid var(--line);border-radius:16px;padding:9px 14px;
  font-size:14px;font-weight:650;color:var(--ink);background:var(--page);
}

/* ---------- Auswahl beim Planen ---------- */
.opt{
  display:block;width:100%;border-radius:24px;padding:18px 20px;margin-top:11px;
  border:2.5px solid transparent;position:relative;transition:transform .12s ease,border-color .2s ease;
}
.opt:active{transform:scale(.982)}
.opt h4{margin:6px 0 0;font-size:19px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.opt .sub{margin:7px 0 0;font-size:14px;font-weight:500;color:rgba(20,24,28,.68)}
.opt .note{
  display:inline-block;margin-top:11px;background:rgba(255,255,255,.72);border-radius:14px;
  padding:8px 12px;font-size:13px;font-weight:700;
}
.draft{margin-top:26px}
.draft h5{margin:0 0 11px;font-size:12px;font-weight:700;color:var(--faint);letter-spacing:.07em;text-transform:uppercase}
.bubble{
  margin:0;background:#DEF3E5;border-radius:22px 22px 22px 7px;padding:15px 17px;
  font-size:15.5px;line-height:1.48;font-weight:500;
}

/* ---------- Mitteilungen ---------- */
.mits{display:flex;flex-direction:column;gap:10px;margin:14px 0 4px}
.mit{display:flex;gap:12px;align-items:flex-start;background:var(--sunk);border-radius:20px;padding:14px 16px}
.mit.neu{background:#FDF0E9}
.mit .ic{width:32px;height:32px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
         background:var(--ink);color:#fff;font-size:14px;font-weight:700}
.mit.neu .ic{background:var(--accent)}
.mit b{display:block;font-size:15px;font-weight:750;letter-spacing:-.02em}
.mit p{margin:2px 0 0!important;font-size:13.5px!important;color:var(--dim);font-weight:500}
.mit small{display:block;font-size:12px;color:var(--faint);font-weight:600;margin-top:5px}
.leer{text-align:center;padding:26px 10px 6px;color:var(--dim);font-size:15px;font-weight:500}

/* ---------- Sheet ---------- */
.scrim{position:absolute;inset:0;background:rgba(20,24,28,.42);z-index:40;animation:auf .25s ease}
@keyframes auf{from{opacity:0}to{opacity:1}}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--page);
  border-radius:32px 32px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;box-shadow:0 -14px 44px -16px rgba(20,24,28,.45);
  animation:hoch .32s cubic-bezier(.32,.72,0,1);max-height:88%;overflow-y:auto;
}
@keyframes hoch{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet > *{flex:0 0 auto}
.grip{width:40px;height:5px;border-radius:3px;background:var(--sunk);margin:0 auto 14px;flex:0 0 auto}
.sheet h3{margin:0;font-size:24px;font-weight:800;letter-spacing:-.035em;text-wrap:balance}
.sheet .kicker{margin-bottom:6px}
.sheet p{margin:8px 0 2px;font-size:15px;color:var(--dim);font-weight:500}
.sheet .bild{height:150px;border-radius:22px;margin:14px 0 4px}

/* ---------- Tab Bar: schwebend, immer sichtbar ---------- */
.tabs{
  position:absolute;left:18px;right:18px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;
  display:flex;gap:4px;background:var(--ink);border-radius:31px;padding:6px;
  box-shadow:0 16px 36px -14px rgba(20,24,28,.55);
}
.tab{
  flex:1;height:50px;border-radius:25px;display:flex;align-items:center;justify-content:center;gap:7px;
  color:rgba(255,255,255,.6);transition:background-color .22s ease,color .22s ease;
}
.tab svg{width:21px;height:21px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab b{font-size:14px;font-weight:650;letter-spacing:-.015em}
.tab[aria-selected="true"]{background:var(--page);color:var(--ink)}
.tab[aria-selected="true"] svg{stroke-width:2.1}
.tab[aria-selected="true"] b{font-weight:750}

/* Werkbank — nur fuer uns, nicht fuer Opa */
.werkbank{margin-top:26px;border:1.5px dashed var(--faint);border-radius:18px;padding:13px}
.werkbank h5{margin:0 0 9px;font-size:11.5px;font-weight:700;color:var(--faint);letter-spacing:.07em;text-transform:uppercase}
.werkbank .reihe{display:flex;flex-wrap:wrap;gap:7px}
.wb{
  border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;
  font-size:12.5px;font-weight:650;color:var(--dim);background:var(--page);
}
.wb[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

@media (prefers-reduced-motion:reduce){
  .sheet,.scrim,.pane.zeigen{animation:none}
  .tap:active,.cta:active,.wd:active,.fil:active,.opt:active,.vor:active{transform:none}
}

/* ---------- Anmelde-Schirm: liegt über allem, bis klar ist, wer da ist ---------- */
.gate{
  position:absolute;inset:0;z-index:60;background:var(--page);
  display:flex;align-items:center;justify-content:center;
  padding:32px 26px calc(32px + env(safe-area-inset-bottom));
}
.gate-in{width:100%;max-width:332px;text-align:center}
.gate-mark{
  width:64px;height:64px;border-radius:22px;margin:0 auto 20px;
  background:linear-gradient(150deg,#3E6E7E,#8FB6BF);color:#fff;
  display:grid;place-items:center;font-size:26px;font-weight:800;
}
.gate-in h1{margin:0 0 12px;font-size:29px;font-weight:800;letter-spacing:-.04em;line-height:1.05}
.gate-in p{margin:0 0 13px;font-size:15.5px;line-height:1.5;color:var(--dim);font-weight:500}
.gate-in p b{color:var(--ink);font-weight:700}
.gate-feld{
  width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;
  font-family:inherit;font-size:16.5px;font-weight:600;color:var(--ink);
  background:var(--page);margin-bottom:6px;-webkit-appearance:none;text-align:center;
}
.gate-feld:focus{outline:none;border-color:var(--accent)}
.gate .cta{margin-top:10px}
.gate-fehler{color:var(--accent);font-weight:600}
.gate-klein{margin-top:16px!important;font-size:13px;color:var(--faint)}
</style>

<script>
/* ==========================================================================
   INHALT — hier und nur hier wird geändert, was in der App steht.
   Kein CSS, kein Layout, keine Technik.

   Wichtig: "plan" ist eine LISTE. Beliebig viele Termine, beliebig weit
   im Voraus, auch mehrere in derselben Woche, auch Wochen ohne alles.
   Später kommt genau diese Liste vom Server; bis dahin steht sie hier.
   ========================================================================== */

  function tagKurz(d) { return TAGE_KURZ[(d.getDay() + 6) % 7]; }
  function tagLang(d) { return TAGE_LANG[(d.getDay() + 6) % 7]; }

  /* ---------- Gedächtnis ---------------------------------------------------
     Alles, was in der App passiert, liegt auf DIESEM Gerät. Es übersteht
     Neuladen und Neustart, aber es geht nirgendwohin. Genau hier wird
     später der Server ansetzen.
     ---------------------------------------------------------------------- */
  function lies(schluessel, ersatz) {
    try {
      var s = localStorage.getItem("ow." + schluessel);
      return s ? JSON.parse(s) : ersatz;
    } catch (e) { return ersatz; }
  }
  function schreib(schluessel, wert) {
    try { localStorage.setItem("ow." + schluessel, JSON.stringify(wert)); } catch (e) {}
  }

  var gelesen   = lies("gelesen", []);    // gelesene Mitteilungen
  var abgesagt  = lies("abgesagt", []);   // abgesagte Termine
  var gruende   = lies("gruende", {});    // warum abgesagt wurde
  var erledigt  = lies("erledigt", []);   // Termine mit Rückmeldung
  var eigene    = lies("eigene", []);     // selbst eingeplante Termine
  var geloescht = lies("geloescht", []);  // von der Familie wieder herausgenommen
  var extraMit  = lies("extraMit", []);   // Mitteilungen, die in der App entstanden sind
  var erlebt    = lies("erlebt", []);     // Rückmeldungen — das sind die Buchseiten
  var fotos     = lies("fotos", {});      // Bilder, nach Kennung
  var weggeklickt = lies("weggeklickt", []); // Hinweise, die wir gelesen haben
  var gemeldet    = lies("gemeldet", []);    // Tage, an denen er selbst Lust gemeldet hat

  // Wie schreib(), sagt aber, ob es geklappt hat. Fotos koennen den
  // Speicher des Geraets sprengen; dann muss der Mensch das erfahren.
  function schreibSicher(k, w) {
    try { localStorage.setItem("ow." + k, JSON.stringify(w)); return true; }
    catch (e) { return false; }
  }

  var BEWERTUNG = ["War nicht so", "Ging so", "Schön", "Sehr schön", "Richtig schön"];

  /* Wer sitzt vor dem Gerät? ------------------------------------------
     Früher entschied das die Adresszeile (?rolle=opa) — ein reiner
     Anzeigeschalter. Jetzt kommt es vom Server: einmal pro Gerät per
     E-Mail-Link anmelden, danach sagt das Mitglieder-Dokument, welche
     Rolle dieses Gerät hat.
       "admin"  – die Familie:  Woche, Buch, Familie
       "user"   – Opas Gerät:   Woche, Buch
       null     – angemeldet, aber noch nicht freigeschaltet

     Ohne Firebase (Datei doppelt angeklickt, lokal entwickelt, Vorschau
     ohne echte Anmeldung) fällt alles auf den alten ?rolle=-Schalter
     zurück, damit die Arbeit am Prototyp weitergeht.
     ------------------------------------------------------------------ */
  var FAM   = window.OW_FAMILIE || "ulland";
  var KONTO = null;   // { uid, email } oder null
  var ROLLE = null;   // "admin" | "user" | null
  var auth  = null, db = null;

  function firebaseDa() {
    return !!(window.firebase && window.OW_FIREBASE && window.OW_FIREBASE.apiKey &&
              firebase.auth && firebase.firestore);
  }

  /* Nur wenn Firebase fehlt: Rolle aus der Adresse / vom Gerät.
     Alte Werte ("opa", "familie") werden mit übersetzt. */
  function entwicklerRolle() {
    var t = "";
    try {
      t = (location.search.match(/[?&]rolle=(opa|user|familie|admin)/) || [])[1] || "";
      if (t) localStorage.setItem("ow.rolle", t);
      else t = localStorage.getItem("ow.rolle") || "";
    } catch (e) {}
    return (t === "opa" || t === "user") ? "user" : "admin";
  }

  /* ---------- Der Schirm über der App ---------- */
  var schirm = null;
  function schirmEl() {
    if (!schirm) {
      schirm = document.createElement("div");
      schirm.className = "gate";
      document.querySelector(".app").appendChild(schirm);
    }
    schirm.hidden = false;
    return schirm;
  }
  function schirmZu() { if (schirm) schirm.hidden = true; }

  function ladeSchirm(text) {
    schirmEl().innerHTML =
      '<div class="gate-in"><div class="gate-mark">O</div>' +
      "<h1>Opas Woche</h1><p>" + roh(text || "Einen Moment …") + "</p></div>";
  }

  function anmeldeSchirm(modus, fehler) {
    var el = schirmEl();
    if (modus === "gesendet") {
      // Vom Home-Bildschirm gestartet ist das Antippen des Links eine
      // Sackgasse: die Mail-App oeffnet immer Safari, und Safari hat einen
      // anderen Speicher als diese App. Dort anzukommen nuetzt hier nichts.
      // Also sagen wir gleich den Weg an, der wirklich funktioniert.
      el.innerHTML = alsApp()
        ? '<div class="gate-in"><div class="gate-mark">O</div>' +
          "<h1>Schau in dein Postfach</h1>" +
          "<p>Wir haben dir eine Mail von <b>Opas Woche</b> geschickt.</p>" +
          "<p><b>Tippe den Link nicht an.</b> Halte ihn gedrückt, wähle <b>Kopieren</b>, komm hierher zurück und füge ihn unten ein.</p>" +
          '<button class="cta" id="gate-einf">Link einfügen</button>' +
          '<button class="cta quiet" id="gate-neu">Andere Adresse</button></div>'
        : '<div class="gate-in"><div class="gate-mark">O</div>' +
          "<h1>Schau in dein Postfach</h1>" +
          "<p>Wir haben dir eine Mail von <b>Opas Woche</b> geschickt. Tippe auf den Link darin — dann ist dieses Gerät angemeldet.</p>" +
          '<button class="cta quiet" id="gate-einf">Link stattdessen einfügen</button>' +
          '<button class="cta quiet" id="gate-neu">Andere Adresse</button></div>';
      $("gate-einf").addEventListener("click", function () { linkSchirm(); });
      $("gate-neu").addEventListener("click", function () { anmeldeSchirm("form"); });
      return;
    }
    el.innerHTML =
      '<div class="gate-in"><div class="gate-mark">O</div>' +
      "<h1>Opas Woche</h1>" +
      "<p>Melde dich einmal an. Danach bleibt dieses Gerät angemeldet — kein Passwort, keine weitere Anmeldung.</p>" +
      '<input class="gate-feld" id="gate-mail" type="email" inputmode="email" autocomplete="email" placeholder="deine@adresse.de">' +
      (fehler ? '<p class="gate-fehler">' + roh(fehler) + "</p>" : "") +
      '<button class="cta" id="gate-los">Link schicken</button>' +
      '<p class="gate-klein">Richtet ihr das für Opa ein? Nehmt hier <b>seine</b> Adresse.</p></div>';
    var feld = $("gate-mail");
    try { feld.value = localStorage.getItem("ow.anmeldeMail") || ""; } catch (e) {}
    $("gate-los").addEventListener("click", function () { linkSchicken(feld.value); });
    feld.addEventListener("keydown", function (e) { if (e.key === "Enter") linkSchicken(feld.value); });
  }

  // Laeuft die App vom Home-Bildschirm statt im Browser?
  function alsApp() {
    if (window.navigator.standalone === true) return true;
    try { return window.matchMedia("(display-mode: standalone)").matches; }
    catch (e) { return false; }
  }

  function linkSchirm(fehler) {
    var el = schirmEl();
    el.innerHTML =
      '<div class="gate-in"><div class="gate-mark">O</div>' +
      "<h1>Link einfügen</h1>" +
      "<p>Den langen Link aus der Mail hier hineinsetzen — gedrückt halten, <b>Einsetzen</b>.</p>" +
      '<input class="gate-feld" id="gate-link" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://…">' +
      (fehler ? '<p class="gate-fehler">' + roh(fehler) + "</p>" : "") +
      '<button class="cta" id="gate-anm">Anmelden</button>' +
      '<button class="cta quiet" id="gate-zurueck">Zurück</button></div>';
    var feld = $("gate-link");
    $("gate-anm").addEventListener("click", function () { mitLinkAnmelden(feld.value); });
    feld.addEventListener("keydown", function (e) { if (e.key === "Enter") mitLinkAnmelden(feld.value); });
    $("gate-zurueck").addEventListener("click", function () { anmeldeSchirm("gesendet"); });
  }

  function mitLinkAnmelden(link) {
    link = String(link || "").trim();
    if (!link || !auth.isSignInWithEmailLink(link)) {
      linkSchirm("Das sieht nicht nach dem Link aus der Mail aus. Er muss vollständig sein, von „https“ bis zum letzten Zeichen.");
      return;
    }
    var mail = "";
    try { mail = localStorage.getItem("ow.anmeldeMail") || ""; } catch (e) {}
    if (!mail) {
      linkSchirm("Ich weiß nicht mehr, an welche Adresse der Link ging. Fordere ihn bitte hier in der App noch einmal an.");
      return;
    }
    ladeSchirm("Wird angemeldet …");
    auth.signInWithEmailLink(mail, link).then(function () {
      try { localStorage.removeItem("ow.anmeldeMail"); } catch (e) {}
    }).catch(function (err) {
      linkSchirm("Der Link hat nicht funktioniert (" + ((err && err.code) || "Fehler") +
        "). Meist ist er schon benutzt oder zu alt — dann fordere hier einen neuen an.");
    });
  }

  function linkSchicken(mail) {
    mail = String(mail || "").trim();
    if (!/.+@.+\..+/.test(mail)) { anmeldeSchirm("form", "Das sieht nicht wie eine Adresse aus."); return; }
    try { localStorage.setItem("ow.anmeldeMail", mail); } catch (e) {}
    ladeSchirm("Wird verschickt …");
    auth.sendSignInLinkToEmail(mail, {
      url: location.origin + location.pathname,
      handleCodeInApp: true
    }).then(function () {
      anmeldeSchirm("gesendet");
    }).catch(function (err) {
      anmeldeSchirm("form", "Das hat nicht geklappt (" + ((err && err.code) || "Fehler") + "). Stimmt die Adresse?");
    });
  }

  function wartenSchirm(hinweis) {
    var el = schirmEl();
    el.innerHTML =
      '<div class="gate-in"><div class="gate-mark">O</div>' +
      "<h1>Fast da</h1>" +
      "<p>Du bist angemeldet als <b>" + roh(KONTO && KONTO.email) + "</b>.</p>" +
      "<p>Jetzt trägt dich jemand aus der Familie ein. Bis dahin bleibt hier alles leer — angemeldet zu sein heißt noch nicht dazuzugehören.</p>" +
      (hinweis ? '<p class="gate-fehler">' + roh(hinweis) + "</p>" : "") +
      '<button class="cta" id="gate-nach">Nachsehen</button>' +
      '<button class="cta quiet" id="gate-ab">Abmelden</button></div>';
    $("gate-nach").addEventListener("click", function () { location.reload(); });
    $("gate-ab").addEventListener("click", function () {
      auth.signOut().then(function () { location.reload(); });
    });
  }

  function abmelden() {
    if (!auth) return;
    auth.signOut().then(function () { location.reload(); });
  }

  /* ---------- Firebase in Gang setzen ---------- */
  function firebaseStart() {
    firebase.initializeApp(window.OW_FIREBASE);
    auth = firebase.auth();
    db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(function () {});

    ladeSchirm();

    // Kommt jemand über den Link aus der Mail zurück?
    if (auth.isSignInWithEmailLink(location.href)) {
      var mail = "";
      try { mail = localStorage.getItem("ow.anmeldeMail") || ""; } catch (e) {}
      if (!mail) mail = window.prompt("Zur Bestätigung noch einmal deine E-Mail-Adresse:") || "";
      auth.signInWithEmailLink(mail, location.href).then(function () {
        try { localStorage.removeItem("ow.anmeldeMail"); } catch (e) {}
        history.replaceState(null, "", location.pathname);
      }).catch(function () {
        history.replaceState(null, "", location.pathname);
        anmeldeSchirm("form", "Der Link hat nicht funktioniert. Bitte noch einmal.");
      });
    }

    auth.onAuthStateChanged(function (user) {
      if (!user) { KONTO = null; ROLLE = null; anmeldeSchirm("form"); return; }
      KONTO = { uid: user.uid, email: user.email || "" };
      ladeSchirm();
      db.collection("familien").doc(FAM).collection("mitglieder").doc(user.uid).get()
        .then(function (snap) {
          if (!snap.exists) { ROLLE = null; wartenSchirm(); return; }
          var d = snap.data() || {};
          ROLLE = d.rolle === "admin" ? "admin" : "user";
          if (d.anrede) INHALT.anrede = d.anrede;
          schirmZu();
          starten();
        })
        .catch(function () {
          ROLLE = null;
          wartenSchirm("Gerade keine Verbindung. Sobald du wieder online bist, hier auf „Nachsehen“ tippen.");
        });
    });
  }

  /* ---------- Plan aufbauen ---------- */
  function aussaat() {
    var mo = montagDieserWoche(new Date());
    var roh = INHALT.plan.map(function (e) {
      var k = {}; for (var s in e) k[s] = e[s];
      k.versatz = e.inWochen * 7 + e.wochentag - 1;   // Tage nach Montag
      return k;
    });
    // Die Beispiele sollen mitwandern statt zu verfallen: liegt der
    // früheste schon hinter uns, rückt der ganze Plan um volle Wochen
    // vor — die Abstände zwischen den Terminen bleiben dabei erhalten.
    var frueh = Math.min.apply(null, roh.map(function (r) { return r.versatz; }));
    var heuteVersatz = tageDazwischen(mo, new Date());
    var schub = 0;
    while (frueh + schub * 7 < heuteVersatz && schub < 520) schub++;
    return roh.map(function (k) {
      k.datum = iso(plusTage(mo, k.versatz + schub * 7));
      return k;
    });
  }

  function alleTermine() {
    return aussaat().concat(eigene)
      .filter(function (e) { return geloescht.indexOf(schluessel(e)) < 0; })
      .sort(function (a, b) {
        return a.datum < b.datum ? -1 : a.datum > b.datum ? 1 : 0;
      });
  }

  /* Der Schlüssel eines Termins.
     Selbst angelegte Termine tragen ein eigenes, festes Kennzeichen. Das
     ist wichtig, weil man sie verschieben können soll: zieht ein Termin
     auf einen anderen Tag um, folgen ihm Absage, Grund und Rückmeldung.
     Die Beispieltermine aus INHALT haben keins — die hängen an Datum und
     Art, und beim ersten Ändern werden sie zu echten Terminen. */
  function schluessel(e) { return e.uid || (e.datum + "|" + e.id); }
  function istAbgesagt(e) { return abgesagt.indexOf(schluessel(e)) >= 0; }
  function istErledigt(e) { return erledigt.indexOf(schluessel(e)) >= 0; }

  /* ---------- Zeichen, Zeit, Sorte ------------------------------------
     Drei kleine Fragen, die überall gestellt werden. Die Antworten stehen
     hier zusammen, damit sie überall dieselben sind.
     ------------------------------------------------------------------ */

  // Jede Kategorie hat ein Zeichen als Rückfall, eigene Zeichen gewinnen.
  // Warum Emoji und keine eigenen Symbole: der Vorrat an Kleinigkeiten ist
  // offen. Ein festes Symbolset kann ihn nie abdecken — für "Blumen gießen"
  // gibt es kein Icon, aber ein Emoji. Genau die Eigenschaft, die sie
  // gestalterisch unsauber macht, ist hier der Grund.
  var KAT_ZEICHEN = {
    wasser: "🏊", kaffee: "☕", runde: "👥",
    rad: "🚲", erzaehlen: "📖", werk: "🌳"
  };
  function zeichenVon(e) {
    return (e && e.emoji) || (e && KAT_ZEICHEN[e.kategorie]) || "·";
  }

  /* Ein Termin hat entweder eine Uhrzeit oder nur eine Tageszeit.
     Eine Kleinigkeit braucht keine Minute — "am Nachmittag" ist genau
     genug. Auf einer Uhrzeit zu bestehen macht aus ihr eine Verabredung,
     die sie nicht ist, und dann steht bei ihm "14:10 Papa holt dich ab"
     für etwas, das er längst allein kann. */
  /* "ab" ist der Anfang der Tageszeit, "bis" ihr Ende.
     Ohne Uhrzeit muss die App trotzdem irgendwann sagen können, dass es
     jetzt so weit ist. Die Werte sind an ihrem Tag ausgerichtet:
       9 Uhr  — davor wird gefrühstückt
       14 Uhr — nach dem Mittagessen (12–13) und der Ruhe danach
       18 Uhr — wenn der Tag zur Ruhe kommt
     Geraten ist daran nichts weiter als die Grenze selbst; wer es besser
     weiß, ändert die vier Zahlen hier und nirgends sonst. */
  var TAGESZEIT = {
    frueh:  { kurz: "vormittags",  satz: "am Vormittag",  lang: "Am Vormittag",  ab: "09:00", bis: 13 },
    mittag: { kurz: "nachmittags", satz: "am Nachmittag", lang: "Am Nachmittag", ab: "14:00", bis: 18 },
    abend:  { kurz: "abends",      satz: "am Abend",      lang: "Am Abend",      ab: "18:00", bis: 22 }
  };
  function tzVon(e) { return TAGESZEIT[e && e.tageszeit] || TAGESZEIT.mittag; }
  function zeitKurz(e) { return e.zeit ? e.zeit : tzVon(e).kurz; }
  function zeitLang(e) { return e.zeit ? e.zeit + " Uhr" : tzVon(e).lang; }
  function zeitSatz(e) { return e.zeit ? "um " + e.zeit : tzVon(e).satz; }

  /* Wem gehört der Zeitpunkt? Ein Angebot aus dem Katalog gehört dem
     Anbieter — der Warmbadetag findet dienstags einfach nicht statt, den
     kann man nicht verschieben. Alles andere gehört uns und darf wandern.
     Das ist die ganze Regel hinter dem Ziehen im Tagesblatt. */
  function istAngebot(e) { return !!e.id && e.id !== "eig"; }

  /* Wer hingebracht wird, muss auch wieder zurück. Solange dazu nichts
     dasteht, ist der Termin nicht fertig geplant — und das gehört beim
     Planen sichtbar gemacht, nicht am Abend vorher gemerkt.
     Geht er allein hin ("·"), gibt es nichts zu klären. */
  function rueckwegOffen(e) {
    return !!(e.abholung && e.abholung.kuerzel !== "\u00b7" && !e.rueckweg);
  }
  function istZiehbar(e) { return !istAngebot(e); }

  /* Hat es angefangen?
     Ab dem Beginn ist nicht mehr die Absage dran, sondern das Foto — das
     entsteht im besten Fall vor Ort und nicht abends aus dem Gedächtnis.
     Deshalb wechselt der Knopf mit dem ersten Moment des Termins, nicht
     erst, wenn er vorbei ist.

     Das ist bewusst ein anderer Zeitpunkt als schonVorbei(). Die Karte
     bleibt der Termin, solange er läuft — "Heute gewesen" über jemandem,
     der noch im Wasser steht, wäre schlicht falsch. Nur der Knopf darunter
     ist schon so weit. */
  function laeuftSchon(e) {
    var jetzt = new Date();
    var diff = tageDazwischen(jetzt, ausIso(e.datum));
    if (diff < 0) return true;
    if (diff > 0) return false;
    var uhr = ("0" + jetzt.getHours()).slice(-2) + ":" + ("0" + jetzt.getMinutes()).slice(-2);
    return uhr >= (e.zeit || tzVon(e).ab);
  }

  function schonVorbei(e) {
    var jetzt = new Date();
    var diff = tageDazwischen(jetzt, ausIso(e.datum));
    if (diff < 0) return true;
    if (diff === 0 && jetzt.getHours() >= (e.gewesenAb || 18)) return true;
    return false;
  }

  /* Was steht im Vordergrund?
     1. Etwas von heute, das schon war und noch keine Rückmeldung hat
     2. sonst der nächste Termin, der noch kommt
     3. sonst etwas aus den letzten drei Tagen ohne Rückmeldung
     4. sonst nichts                                                     */
  function aktuell() {
    var liste = alleTermine();
    var heute = new Date(), i, e;

    for (i = 0; i < liste.length; i++) {
      e = liste[i];
      if (istAbgesagt(e) || istErledigt(e)) continue;
      if (tageDazwischen(heute, ausIso(e.datum)) === 0 && schonVorbei(e)) return e;
    }
    // Das Nächste, was ansteht — und zwar das nächste, das WIRKLICH ansteht.
    // Abgesagtes gehört nicht auf die Startseite; es verschwindet aber auch
    // nicht: der Tag behält im Streifen einen grauen Punkt, und von dort
    // kommt Opa jederzeit wieder dran.
    for (i = 0; i < liste.length; i++) {
      e = liste[i];
      if (schonVorbei(e) || istAbgesagt(e)) continue;
      return e;
    }
    for (i = liste.length - 1; i >= 0; i--) {
      e = liste[i];
      if (istAbgesagt(e) || istErledigt(e)) continue;
      var alter = -tageDazwischen(heute, ausIso(e.datum));
      if (alter > 0 && alter <= 3) return e;
    }
    return null;
  }

  /* ---------- Mitteilungen ---------- */
  function alleMitteilungen() {
    var heute = mitternacht(new Date());
    var fest = INHALT.mitteilungen.map(function (m) {
      var k = {}; for (var s in m) k[s] = m[s];
      k.datum = iso(plusTage(heute, -m.vorTagen));
      return k;
    });
    return fest.concat(extraMit).sort(function (a, b) {
      return a.datum < b.datum ? 1 : a.datum > b.datum ? -1 : 0;
    });
  }
  function ungelesen() {
    return alleMitteilungen().filter(function (m) { return gelesen.indexOf(m.id) < 0; });
  }
  function neueMitteilung(m) {
    m.datum = iso(new Date());
    m.id = m.id || ("x" + Date.now() + Math.round(Math.random() * 999));
    extraMit.push(m);
    schreib("extraMit", extraMit);
  }
  function zeichneGlocken() {
    var n = ungelesen().length;
    alle(".bell i").forEach(function (i) { i.hidden = n === 0; });
  }

  function wannText(datumIso) {
    var d = ausIso(datumIso);
    var abstand = tageDazwischen(d, new Date());
    if (abstand === 0) return "Heute";
    if (abstand === 1) return "Gestern";
    if (abstand > 1 && abstand < 7) return "Vor " + abstand + " Tagen";
    return d.getDate() + ". " + MON_KURZ[d.getMonth()];
  }

  function mitteilungenSheet() {
    var liste = alleMitteilungen();
    var html = "<h3>Mitteilungen</h3>";

    if (!liste.length) {
      html += '<div class="leer">Hier ist noch nichts.<br>Wenn etwas ansteht, siehst du es hier.</div>';
    } else {
      html += '<div class="mits">' + liste.map(function (m) {
        var neu = gelesen.indexOf(m.id) < 0;
        return '<div class="mit' + (neu ? " neu" : "") + '">' +
          '<div class="ic">' + (m.von || "!") + "</div><div>" +
          "<b>" + roh(m.titel) + "</b><p>" + roh(m.text) + "</p>" +
          "<small>" + wannText(m.datum) + "</small></div></div>";
      }).join("") + "</div>";
    }
    html += '<button class="cta quiet" data-zu>Schließen</button>';
    sheetAuf(html);

    // Angesehen heisst gelesen. Der Punkt geht weg.
    liste.forEach(function (m) { if (gelesen.indexOf(m.id) < 0) gelesen.push(m.id); });
    schreib("gelesen", gelesen);
    setTimeout(zeichneGlocken, 600);
  }

  /* ---------- Motive: dieselben Formen wie das App-Icon ---------- */
  var FARBPAARE = {
    wasser:    ["#A9E6F5","#17607C"],
    runde:     ["#DCC0E8","#5B3D74"],
    kaffee:    ["#FFD3A6","#9A5220"],
    rad:       ["#C6EDB4","#2F6A33"],
    erzaehlen: ["#FBE6A8","#8A6A15"],
    werk:      ["#E6D6C4","#6E5540"],
    still:     ["#DDE3E6","#8A959B"]
  };
  var motivZaehler = 0;

  function motiv(kategorie) {
    var f = FARBPAARE[kategorie] || FARBPAARE.wasser;
    var n = "m" + (++motivZaehler);
    var zweit = kategorie === "still" ? ["#E4E7E9","#AEB6BA"] : ["#FFCE95","#BE5F1B"];
    return '<svg viewBox="0 0 146 146" aria-hidden="true"><defs>' +
      '<linearGradient id="a' + n + '" x1=".2" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="' + f[0] + '"/><stop offset="1" stop-color="' + f[1] + '"/></linearGradient>' +
      '<linearGradient id="b' + n + '" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="' + zweit[0] + '"/><stop offset="1" stop-color="' + zweit[1] + '"/></linearGradient>' +
      '<linearGradient id="c' + n + '" x1=".1" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B9CBD3"/></linearGradient>' +
      '</defs>' +
      '<circle cx="99" cy="47" r="24" fill="none" stroke="url(#b' + n + ')" stroke-width="15"/>' +
      '<rect x="86" y="92" width="42" height="26" rx="13" fill="url(#c' + n + ')"/>' +
      '<circle cx="58" cy="62" r="34" fill="none" stroke="url(#a' + n + ')" stroke-width="21"/>' +
      '<ellipse cx="47" cy="41" rx="11" ry="6" fill="rgba(255,255,255,.5)" transform="rotate(-34 47 41)"/>' +
      '</svg>';
  }

  function motivKamera() {
    var n = "k" + (++motivZaehler);
    return '<svg viewBox="0 0 146 146" aria-hidden="true"><defs>' +
      '<linearGradient id="a' + n + '" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#B7E9C6"/><stop offset="1" stop-color="#1F6448"/></linearGradient>' +
      '<linearGradient id="b' + n + '" x1=".1" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C4D2C0"/></linearGradient>' +
      '<linearGradient id="c' + n + '" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#FFC98A"/><stop offset="1" stop-color="#C0641F"/></linearGradient>' +
      '</defs>' +
      '<rect x="88" y="92" width="42" height="34" rx="15" fill="url(#c' + n + ')"/>' +
      '<rect x="24" y="46" width="90" height="70" rx="24" fill="url(#a' + n + ')"/>' +
      '<rect x="52" y="34" width="34" height="16" rx="8" fill="url(#a' + n + ')"/>' +
      '<circle cx="69" cy="81" r="23" fill="url(#b' + n + ')"/>' +
      '<circle cx="69" cy="81" r="11" fill="#1F6448"/>' +
      '<ellipse cx="56" cy="68" rx="9" ry="5" fill="rgba(255,255,255,.5)" transform="rotate(-34 56 68)"/>' +
      '</svg>';
  }

  /* ---------- Werkbank: Zustände durchspielen (nur fuer uns) ---------- */
  var werkbank = "";   // "", "gewesen", "abgesagt", "leer"

  /* ---------- Sheet ---------- */
  var sheet = $("sheet"), scrim = $("scrim");
  function sheetZu() { sheet.hidden = true; scrim.hidden = true; }
  function sheetAuf(inhaltHtml) {
    sheet.innerHTML = '<div class="grip"></div>' + inhaltHtml;
    sheet.hidden = false;
    scrim.hidden = false;
    sheet.scrollTop = 0;
    var zu = sheet.querySelector("[data-zu]");
    if (zu) zu.addEventListener("click", sheetZu);
  }
  scrim.addEventListener("click", sheetZu);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") sheetZu(); });

  /* ---------- Gesichter ---------- */
  function gesichter() {
    alle("[data-opa]").forEach(function (el) {
      if (!INHALT.opaFoto) { el.textContent = "O"; return; }
      el.classList.add("foto");
      var img = new Image();
      img.alt = "Opa";
      img.onerror = function () { el.classList.remove("foto"); el.textContent = "O"; };
      img.src = INHALT.opaFoto;
      el.textContent = "O";
      el.appendChild(img);
    });
    $("faces").innerHTML = INHALT.familie.map(function (p) {
      return '<div class="face ' + p.farbe + '">' + p.kuerzel + "</div>";
    }).join("");
  }

  /* ---------- Woche ---------- */
  function abstandText(e, gewesen) {
    var d = ausIso(e.datum);
    var diff = tageDazwischen(new Date(), d);
    if (gewesen) return diff === 0 ? "Heute gewesen" : "War am " + tagLang(d);
    if (diff === 0) return "Heute";
    if (diff === 1) return "Morgen";
    if (diff < 7)  return "In " + diff + " Tagen";
    if (diff < 14) return "Nächste Woche";
    return "In " + Math.round(diff / 7) + " Wochen";
  }

  /* Welchen Termin schaut er gerade an?
     null heisst: den Standard, also das nächste, was ansteht. Tippt er im
     Streifen auf einen Tag, an dem etwas steht, steht hier dessen Termin.
     Beim Zurück-Knopf, beim Reiterwechsel und beim Wiederöffnen der App
     fällt es auf null zurück: Herumschauen ist ein Ausflug, kein Zustand. */
  var blick = null;      // {key: …} oder null
  var imFokus = null;    // der Termin, den die grosse Karte gerade zeigt

  // Nur die sieben Tage im Streifen sind erreichbar. Was herausrutscht
  // (weil die App über Nacht offen lag), gilt nicht mehr.
  function imStreifen(d) {
    var ab = tageDazwischen(new Date(), d);
    return ab >= 0 && ab < 7;
  }
  function terminZu(s) {
    var t = alleTermine().filter(function (x) { return schluessel(x) === s; })[0];
    return (t && imStreifen(ausIso(t.datum))) ? t : null;
  }
  /* "Heute", "Morgen", "In 4 Tagen" — mehr braucht es im Streifen nicht,
     weil dort ohnehin nur sieben Tage liegen. */
  function wannKurz(d) {
    var diff = tageDazwischen(new Date(), d);
    return diff === 0 ? "Heute" : diff === 1 ? "Morgen" : "In " + diff + " Tagen";
  }

  function zeichneWoche() {
    var heute = new Date();
    $("anrede").textContent = INHALT.anrede;
    $("heute-zeile").textContent = langesDatum(heute);

    var e = null;
    if (werkbank !== "leer") {
      if (blick && blick.key) {
        e = terminZu(blick.key);
        if (!e) blick = null;
      }
      if (!e) e = aktuell();
    }
    imFokus = e;

    var gewesen = !!e && (werkbank === "gewesen" || schonVorbei(e));
    var weg     = !!e && (werkbank === "abgesagt" || istAbgesagt(e));
    var innen   = document.querySelector("#hero .inner");

    $("hero").classList.toggle("stumm", !e || weg);
    innen.style.background = "";

    if (!e) {
      $("art").innerHTML = motiv("still");
      $("chip").textContent = "Nichts vorgesehen";
      $("hero-titel").textContent = INHALT.leer.titel;
      $("hero-meta").textContent = INHALT.leer.meta;
      $("band").className = "band";
      $("band-ic").textContent = "·";
      $("band-titel").textContent = INHALT.leer.band.titel;
      $("band-text").textContent = INHALT.leer.band.text;
    } else if (weg) {
      $("art").innerHTML = motiv("still");
      $("chip").textContent = "Abgesagt";
      $("hero-titel").textContent = e.titel;
      $("hero-meta").textContent = tagLang(ausIso(e.datum)) + " " + zeitKurz(e) + " · abgesagt";
      $("band").className = "band";
      $("band-ic").textContent = "·";
      $("band-titel").textContent = "Die Familie weiß Bescheid";
      $("band-text").textContent = "Wir suchen etwas anderes";
    } else {
      $("art").innerHTML = gewesen ? motivKamera() : motiv(e.kategorie);
      innen.style.background = gewesen ? "var(--c-rad)" : "var(--c-" + e.kategorie + ")";
      $("chip").textContent = abstandText(e, gewesen);
      $("hero-titel").textContent = e.titel;
      $("hero-meta").textContent = gewesen
        ? tagLang(ausIso(e.datum)) + " · war " + zeitSatz(e)
        : tagLang(ausIso(e.datum)) + " " + zeitKurz(e) + " · " + e.ort;
      var band = gewesen ? e.danach : e.abholung;
      $("band").className = "band" + (gewesen ? " fertig" : "");
      $("band-ic").textContent = gewesen ? "✓" : e.abholung.kuerzel;
      $("band-titel").textContent = band.titel;
      $("band-text").textContent = band.text;
      // Der Rückweg steht mit Absicht nicht hier, sondern erst im Blatt,
      // das ein Tipp auf die Karte öffnet. Siehe ereignisSheet().
    }

    zeichneStreifen(e ? e.datum : null);
    zeichneAktion(e, gewesen, weg);
    zeichneRail();
  }

  /* Die nächsten sieben Tage, heute zuerst.
       Oranger Rahmen, oranger Punkt = da steht etwas an.
       Grauer Punkt                  = da war etwas, es ist abgesagt.
       Grosse Zahl                   = das ist der Tag, den die Karte zeigt.
     Der angeschaute Tag bekommt mit Absicht keine eigene Farbe: in einer
     Reihe aus sieben Kaesten waeren drei Farbbedeutungen zu viel. Die Zahl
     waechst stattdessen — das sieht man auch aus dem Augenwinkel.

     Die grosse Karte zeigt nur noch Termine. Ein Tipp auf einen leeren Tag
     oeffnet stattdessen ein Blatt von unten. Der Unterschied ist nicht
     kosmetisch: vorher machte ein Fingertipp aus einer leeren Stelle eine
     Ansage ("Nichts vorgesehen"), die dann oben stehen blieb, wo sonst das
     Naechste steht. Jetzt bleibt oben stehen, was ansteht — und das Blatt
     ist eine Auskunft, die man wieder zumacht. */
  function zeichneStreifen(fokusDatum) {
    var heute = new Date();
    var termine = alleTermine();
    var html = "";

    function amTag(tag) {
      return termine.filter(function (x) { return x.datum === iso(tag); });
    }

    for (var i = 0; i < 7; i++) {
      var tag = plusTage(heute, i);
      var hat = amTag(tag);
      var offen = hat.filter(function (x) { return !istAbgesagt(x); });
      var k = "wd" + (i === 0 ? " today" : "");
      if (offen.length) k += " event";
      else if (hat.length) k += " ab";
      if (fokusDatum && iso(tag) === fokusDatum) k += " blick";
      html += '<button class="' + k + '" data-tag="' + i + '">' +
        '<span class="dot"><i></i></span><b>' + tagKurz(tag) + "</b>" +
        '<span class="num">' + tag.getDate() + "</span></button>";
    }
    $("week").innerHTML = html;

    Array.prototype.forEach.call($("week").children, function (el) {
      el.addEventListener("click", function () {
        var tag = plusTage(new Date(), +el.dataset.tag);
        var hat = amTag(tag);
        if (!hat.length) { leerSheet(tag); return; }
        if (hat.length > 1) { wahlSheet(tag, hat); return; }
        blick = { key: schluessel(hat[0]) };
        zeichneWoche();
      });
    });
  }

  function zeichneAktion(e, gewesen, weg) {
    var ziel = $("aktion");
    ziel.innerHTML = "";

    // Steht gar nichts an, ist der einzige sinnvolle Knopf der, mit dem
    // er selbst etwas anstösst.
    if (!e) {
      if (gemeldet.indexOf(iso(new Date())) < 0) {
        ziel.innerHTML = '<button class="cta leise" id="lust-heute">Ich hätte Lust auf etwas</button>';
        $("lust-heute").addEventListener("click", function () { lustMelden(new Date()); });
      }
      return;
    }

    /* Zeigt die Karte etwas anderes als das, was als Nächstes ansteht?
       Dann steht links in dieser Reihe ein Pfeil zurück. Er gehört hierher
       und nicht in eine eigene Zeile darüber — sonst schiebt er beim
       Auftauchen alles nach unten. So wird nur der Knopf daneben schmaler. */
    var standard = aktuell();
    var pfeil = !!standard && schluessel(e) !== schluessel(standard);

    // Nichts mehr zu tun: der Tag ist vorbei, oder die Rückmeldung steht schon.
    var knopf = "";
    if (weg && gewesen) knopf = "";
    else if (gewesen && istErledigt(e)) knopf = "";
    else if (weg)    knopf = '<button class="cta" id="doch">Doch, ich gehe hin</button>';
    // Sobald es angefangen hat, ist die Frage nach dem Foto dran.
    else if (gewesen || laeuftSchon(e)) knopf = '<button class="cta" id="wie-wars">Wie war\'s?</button>';
    else              knopf = '<button class="cta leise" id="passt-nicht">Passt mir doch nicht</button>';

    if (!pfeil && !knopf) return;

    ziel.innerHTML = '<div class="aktionsreihe">' +
      (pfeil ? '<button class="zurueck" id="zur-naechstes" ' +
                 'aria-label="Zurück zu dem, was als Nächstes ansteht">\u2039</button>' : "") +
      knopf + "</div>";

    if (pfeil) {
      $("zur-naechstes").addEventListener("click", function () {
        blick = null;
        zeichneWoche();
      });
    }

    var doch = $("doch");
    if (doch) doch.addEventListener("click", function () {
      var s = schluessel(e);
      abgesagt = abgesagt.filter(function (x) { return x !== s; });
      schreib("abgesagt", abgesagt);
      neueMitteilung({ von: "!", titel: "Doch zugesagt",
        text: e.titel + " steht wieder. Die Familie weiß Bescheid." });
      werkbank = "";
      zeichneAlles();
    });
    var wie = $("wie-wars");
    if (wie) wie.addEventListener("click", function () { rueckmeldungSheet(e); });
    var nein = $("passt-nicht");
    if (nein) nein.addEventListener("click", function () { absageSheet(e); });
  }

  /* Das Buch ist keine feste Liste mehr. Jede Rückmeldung wird eine Seite —
     mit Foto, wenn eins dabei war, sonst mit Farbe. Die alten Einträge aus
     INHALT hängen als Vergangenheit hinten dran. */
  function buchSeiten() {
    var meine = erlebt.slice().sort(function (a, b) {
      return a.datum < b.datum ? 1 : a.datum > b.datum ? -1 : 0;
    }).map(function (x) {
      var d = ausIso(x.datum);
      var kat = x.kategorie === "erzaehlen" ? "erz" : (x.kategorie || "werk");
      return {
        monat: MONATE[d.getMonth()],
        titel: x.titel,
        farbe: "e-" + kat,
        foto: "ph-1",
        fotoId: x.fotoId,
        reaktionen: BEWERTUNG[(x.bewertung || 4) - 1] +
          (x.notiz ? " · „" + x.notiz + "“" : "") +
          (x.fotoId ? " · mit Foto" : ""),
        art: "neu"
      };
    });
    return meine.concat(INHALT.buch);
  }

  function phKlasse(b) { return "ph " + (b.fotoId && fotos[b.fotoId] ? "echt" : b.foto); }
  function phStil(b)  { return b.fotoId && fotos[b.fotoId] ? ' style="background-image:url(' + fotos[b.fotoId] + ')"' : ""; }

  function zeichneRail() {
    var seiten = buchSeiten();
    $("buch-zahl").textContent = seiten.length + " Seiten";
    $("rail").innerHTML = seiten.slice(0, 5).map(function (b, i) {
      return '<button class="tile tap" data-b="' + i + '">' +
        '<div class="' + phKlasse(b) + '"' + phStil(b) + "></div><b>" + roh(b.titel) + "</b>" +
        "<small>" + b.monat + "</small></button>";
    }).join("");
    Array.prototype.forEach.call($("rail").children, function (el) {
      el.addEventListener("click", function () { buchSheet(seiten[+el.dataset.b]); });
    });
  }

  /* ---------- Sheets ---------- */

  /* Opas Blatt, wenn an einem Tag mehr als eine Sache steht: welche davon
     soll die Karte oben zeigen? Nicht zu verwechseln mit dem Tagesblatt
     weiter unten — das ist die Planungsfläche der Familie. */
  function wahlSheet(tag, liste) {
    sheetAuf(
      '<div class="kicker">' + langesDatum(tag) + "</div>" +
      "<h3>Was an dem Tag ansteht</h3>" +
      liste.map(function (x, i) {
        return '<button class="cta' + (i ? " quiet" : "") + '" data-x="' + i + '">' +
          roh(x.titel) + " · " + roh(zeitKurz(x)) + (istAbgesagt(x) ? " · abgesagt" : "") + "</button>";
      }).join("") +
      '<button class="cta quiet" data-zu>Zurück</button>'
    );
    alle("#sheet [data-x]").forEach(function (b) {
      b.addEventListener("click", function () {
        blick = { key: schluessel(liste[+b.dataset.x]) };
        sheetZu();
        zeichneWoche();
      });
    });
  }

  /* Ein Tag, an dem nichts steht.
     Das Blatt sagt genau das und nicht mehr — und trägt einen Knopf, mit
     dem er selbst etwas anstossen kann. Das ist der einzige Weg, auf dem
     etwas von ihm zu uns kommt, ohne dass wir vorher gefragt haben. Er
     muss dafür nichts ausdenken und nichts schreiben; das Ausdenken ist
     unsere Arbeit. */
  function leerSheet(tag) {
    var schon = gemeldet.indexOf(iso(tag)) >= 0;
    sheetAuf(
      '<div class="kicker">' + wannKurz(tag) + "</div>" +
      "<h3>Nichts vorgesehen</h3>" +
      "<p>" + langesDatum(tag) + "</p>" +
      "<p>" + INHALT.leer.band.titel + ". " + INHALT.leer.band.text + ".</p>" +
      (schon
        ? '<div class="leer">Wir wissen Bescheid.<br>Wir melden uns.</div>'
        : '<button class="cta" id="lust">Ich hätte Lust auf etwas</button>') +
      '<button class="cta quiet" data-zu>Zurück</button>'
    );
    var b = $("lust");
    if (b) b.addEventListener("click", function () { lustMelden(tag); });
  }

  /* Er hebt die Hand. Mehr passiert hier nicht — kein Vorschlag, keine
     Auswahl, keine Frage zurück. Was daraus wird, ist unsere Sache. */
  function lustMelden(tag) {
    gemeldet.push(iso(tag));
    schreib("gemeldet", gemeldet);
    neueMitteilung({ von: "O", titel: "Opa hätte Lust auf etwas",
      text: tagLang(tag) + ", " + tag.getDate() + ". " + MON_KURZ[tag.getMonth()] + " ist bei ihm noch frei." });
    sheetAuf(
      "<h3>Ist angekommen</h3>" +
      "<p>Wir schauen, was an dem Tag geht, und melden uns.</p>" +
      '<button class="cta quiet" data-zu>Gut</button>'
    );
    zeichneAlles();
  }

  /* Ein Band im Fliesstext.
     "Papa holt dich ab" + "um 14:10 vor der Tür" ist ein Satz und laeuft
     ohne Trenner richtig. "Wann du magst" + "In deinem Tempo." sind zwei —
     ohne Trenner stossen sie aneinander. Grossbuchstabe heisst: neuer Satz. */
  function bandSatz(b) {
    if (!b) return "";
    if (!b.text) return b.titel;
    return b.titel + (/^[A-ZÄÖÜ]/.test(b.text) ? " \u00b7 " : " ") + b.text;
  }

  function ereignisSheet(e) {
    if (!e) return;
    var d = ausIso(e.datum), gewesen = schonVorbei(e), weg = istAbgesagt(e);
    sheetAuf(
      '<div class="kicker">' + (weg ? "Abgesagt" : abstandText(e, gewesen)) + "</div>" +
      "<h3>" + roh(e.titel) + "</h3>" +
      "<p>" + langesDatum(d) + " " + roh(zeitSatz(e)) + " · " + roh(e.ort) + "</p>" +
      (e.zusatz && !(e.abholung && e.abholung.text === e.zusatz)
        ? "<p>" + roh(e.zusatz) + "</p>" : "") +
      (weg ? "" : "<p>" + roh(gewesen ? e.danach.titel : bandSatz(e.abholung)) + "</p>") +
      // Der Rückweg als eigener Satz. Für ihn ist das die Frage, die zählt.
      (!weg && !gewesen && e.rueckweg && e.rueckweg.kuerzel !== "\u00b7"
        ? "<p>" + roh(bandSatz(e.rueckweg)) + "</p>" : "") +
      (gewesen && !weg ? '<button class="cta" id="sheet-wie">Wie war\'s?</button>' : "") +
      (!gewesen && !weg ? '<button class="cta quiet" id="sheet-nein">Passt mir doch nicht</button>' : "") +
      '<button class="cta quiet" data-zu>Zurück</button>'
    );
    var a = $("sheet-wie");  if (a) a.addEventListener("click", function () { rueckmeldungSheet(e); });
    var b = $("sheet-nein"); if (b) b.addEventListener("click", function () { absageSheet(e); });
  }

  /* Absagen. Das Wichtigste dabei: Opa muss sehen, dass sein Tippen
     etwas bewirkt hat — und es zurücknehmen können. */
  function absageSheet(e) {
    sheetAuf(
      "<h3>Passt dir nicht?</h3>" +
      "<p>Schreib kurz, warum. Dann wissen wir, was wir stattdessen suchen sollen.</p>" +
      '<textarea class="grund" id="grund" rows="3" placeholder="Zum Beispiel: Ich habe etwas anderes vor."></textarea>' +
      '<button class="cta" id="ja-absagen" disabled>Absagen</button>' +
      '<button class="cta quiet" data-zu>Doch, passt schon</button>' +
      // Ausweg fuer den Tag, an dem das Tippen nicht geht. Ohne den
      // wuerde er im Zweifel gar nicht absagen und einfach nicht hingehen.
      '<button class="klein" id="statt-schreiben">Ich kann gerade nicht schreiben — ruft mich an</button>'
    );
    var feld = $("grund"), knopf = $("ja-absagen");
    feld.addEventListener("input", function () {
      knopf.disabled = feld.value.trim().length < 3;
    });
    knopf.addEventListener("click", function () { absagen(e, feld.value.trim()); });
    $("statt-schreiben").addEventListener("click", function () { absagen(e, "Bitte ruft mich an."); });
  }

  function absagen(e, grund) {
    abgesagt.push(schluessel(e));
    schreib("abgesagt", abgesagt);
    gruende[schluessel(e)] = grund;
    schreib("gruende", gruende);
    neueMitteilung({ von: "!", titel: "Abgesagt: " + e.titel, text: grund });
    werkbank = "";
    // Die Karte bleibt auf dem abgesagten Termin stehen, damit er sieht,
    // dass sein Tippen angekommen ist. Beim nächsten Öffnen steht dort
    // wieder das Nächste, was ansteht — der graue Punkt bleibt.
    blick = { key: schluessel(e) };
    sheetAuf(
      "<h3>Ist abgesagt</h3>" +
      "<p>Wir melden uns mit etwas anderem. Du musst nichts weiter tun.</p>" +
      '<button class="cta quiet" data-zu>Gut</button>'
    );
    zeichneAlles();
  }

  /* ---------- Foto: aussuchen, verkleinern, behalten ---------- */
  // Ein Handyfoto hat mehrere Megabyte. So gross passt es nirgends hin und
  // waere fuer eine Buchseite auch Unsinn. Deshalb wird es vor dem Speichern
  // auf 800 Pixel gerechnet — das reicht fuer Bildschirm und Druck.
  function verkleinern(datei, fertig) {
    var leser = new FileReader();
    leser.onerror = function () { fertig(null); };
    leser.onload = function () {
      var bild = new Image();
      bild.onerror = function () { fertig(null); };
      bild.onload = function () {
        var max = 800;
        var s = Math.min(1, max / Math.max(bild.width, bild.height));
        var c = document.createElement("canvas");
        c.width = Math.round(bild.width * s);
        c.height = Math.round(bild.height * s);
        c.getContext("2d").drawImage(bild, 0, 0, c.width, c.height);
        try { fertig(c.toDataURL("image/jpeg", 0.72)); }
        catch (e) { fertig(null); }
      };
      bild.src = leser.result;
    };
    leser.readAsDataURL(datei);
  }

  function fotoAussuchen(fertig) {
    var inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "image/*";
    inp.style.cssText = "position:absolute;left:-9999px";
    document.body.appendChild(inp);
    inp.addEventListener("change", function () {
      var d = inp.files && inp.files[0];
      if (inp.parentNode) document.body.removeChild(inp);
      if (!d) { fertig(null); return; }
      verkleinern(d, fertig);
    });
    inp.click();
  }

  /* ---------- Wie war's — und daraus wird die Buchseite ---------- */
  function rueckmeldungSheet(e) {
    var stand = { bewertung: 4, notiz: "", fotoId: null, fehler: "" };

    function zeichnen() {
      sheetAuf(
        '<div class="kicker">' + langesDatum(ausIso(e.datum)) + "</div>" +
        "<h3>Wie war's?</h3>" +
        '<div class="regler">' +
          '<input type="range" id="bew" min="1" max="5" step="1" value="' + stand.bewertung +
          '" aria-label="Wie war es"><b id="bew-text">' + BEWERTUNG[stand.bewertung - 1] + "</b>" +
        "</div>" +
        (stand.fotoId
          ? '<div class="bild ph echt" style="background-image:url(' + fotos[stand.fotoId] + ')"></div>' +
            '<button class="klein" id="foto-weg">Foto wieder wegnehmen</button>'
          : '<button class="cta quiet" id="foto">Foto dazu</button>') +
        (stand.fehler ? '<p style="color:var(--accent);font-weight:600">' + stand.fehler + "</p>" : "") +
        '<textarea class="grund" id="notiz" rows="2" placeholder="Magst du etwas dazuschreiben? Musst du nicht.">' +
          stand.notiz + "</textarea>" +
        '<button class="cta" id="ins-buch">Ins Buch</button>' +
        '<button class="cta quiet" data-zu>Später</button>'
      );

      var regler = $("bew");
      regler.addEventListener("input", function () {
        stand.bewertung = +regler.value;
        $("bew-text").textContent = BEWERTUNG[stand.bewertung - 1];
      });

      var notiz = $("notiz");
      notiz.addEventListener("input", function () { stand.notiz = notiz.value; });

      var fotoKnopf = $("foto");
      if (fotoKnopf) fotoKnopf.addEventListener("click", function () {
        fotoAussuchen(function (bild) {
